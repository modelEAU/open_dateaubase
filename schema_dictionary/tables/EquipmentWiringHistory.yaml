_format_version: "1.0"
table:
  name: EquipmentWiringHistory
  schema: dbo
  description: >
    Temporal record of how a piece of Equipment is wired to a SignalInterface
    (and optionally a specific SignalInterfacePort). When a sensor probe is
    swapped, rewired to a different input, or temporarily disconnected, a
    closed row is written and (usually) a new open row is opened. The port
    reference is nullable: at ingest time the interface + tag are always
    known, but the physical port may not have been traced yet.
    Replaces SignalPortEquipmentHistory. At most one row per Equipment may
    have ValidTo IS NULL (the equipment's current wiring).

  columns:
    - name: EquipmentWiringHistory_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: Equipment_ID
      logical_type: integer
      nullable: false
      description: "The physical instrument whose wiring is recorded here"
      foreign_key:
        table: Equipment
        column: Equipment_ID

    - name: SignalInterface_ID
      logical_type: integer
      nullable: false
      description: "The interface this equipment is wired into during this period"
      foreign_key:
        table: SignalInterface
        column: SignalInterface_ID

    - name: SignalInterfacePort_ID
      logical_type: integer
      nullable: true
      description: "Specific port on the interface (NULL when not yet traced)"
      foreign_key:
        table: SignalInterfacePort
        column: SignalInterfacePort_ID

    - name: ValidFrom
      logical_type: timestamp
      precision: 7
      nullable: false
      description: "UTC datetime when this wiring started"

    - name: ValidTo
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "UTC datetime when this wiring ended. NULL = currently wired."

    - name: Note
      logical_type: text
      nullable: true
      description: "Free-text notes (reason for rewire, calibration context)"

  indexes:
    - name: UQ_EquipmentWiringHistory_ActiveRow
      columns: [Equipment_ID]
      unique: true
      description: "At most one active (ValidTo IS NULL) wiring row per equipment. Filtered index."
    - name: IX_EquipmentWiringHistory_Interface
      columns: [SignalInterface_ID, ValidFrom]
      unique: false
      description: "Supports equipment-at-time lookups by interface"

  primary_key: [EquipmentWiringHistory_ID]
