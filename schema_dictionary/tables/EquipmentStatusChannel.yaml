_format_version: "1.0"
table:
  name: EquipmentStatusChannel
  schema: dbo
  description: >
    Maps each piece of equipment to the Channel that carries its device-level
    status codes. Introduced in v2.1.0 (Phase C) to replace the
    StatusOfEquipmentID column that was previously held directly on the Channel
    table. One equipment can have at most one device-level status channel.

  columns:
    - name: Equipment_ID
      logical_type: integer
      nullable: false
      description: "Equipment whose device-level status is being tracked."
      foreign_key:
        table: Equipment
        column: Equipment_ID

    - name: StatusChannel_ID
      logical_type: integer
      nullable: false
      description: "Channel that carries the device-level status time series."
      foreign_key:
        table: Channel
        column: Channel_ID

  primary_key: [Equipment_ID]
