_format_version: "1.0"
table:
  name: LabPanel
  schema: dbo
  description: >
    Named, reusable bundle of AnalysisSeries to run together in a lab session.
    Copy-on-use: selecting a panel pre-populates the series list for a new
    LabExperiment; the resulting experiment is fully independent. Analogous to
    a clinical lab panel.

  columns:
    - name: LabPanel_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: Name
      logical_type: string
      max_length: 200
      nullable: false
      description: "Human-readable panel name (e.g. 'PSVD Weekly Panel')"

    - name: Description
      logical_type: string
      max_length: max
      nullable: true
      description: "Free-text description of the panel's purpose"

    - name: CreatedByPerson_ID
      logical_type: integer
      nullable: true
      description: "Person who created this panel"
      foreign_key:
        table: Person
        column: Person_ID

    - name: DefaultSampleCollectionKind_ID
      logical_type: integer
      nullable: true
      description: "Default sample collection method pre-filled when this panel is loaded (e.g. Grab)"
      foreign_key:
        table: SampleCollectionKind
        column: SampleCollectionKind_ID

    - name: DefaultSampleEquipment_ID
      logical_type: integer
      nullable: true
      description: "Default equipment pre-filled when this panel is loaded (e.g. auto-sampler ID)"
      foreign_key:
        table: Equipment
        column: Equipment_ID

    - name: CreatedAt
      logical_type: timestamp
      precision: 7
      nullable: false
      description: "When this panel was created (UTC)"
      default: "GETUTCDATE()"

  primary_key: [LabPanel_ID]
