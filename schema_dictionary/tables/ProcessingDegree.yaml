_format_version: "1.0"
table:
  name: ProcessingDegree
  schema: dbo
  description: >
    Controlled dictionary describing the level of processing applied to a Channel's
    time series. A new Channel row is created each time the processing degree changes —
    this field is set once at row creation. The DataLineage graph is the authoritative
    record of how each Channel was derived; this field exists for fast filtering.

  columns:
    - name: ProcessingDegree_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Processing level name (e.g. 'Raw', 'Cleaned')"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of what this processing level means"

  primary_key: [ProcessingDegree_ID]

  seed_data:
    - { ProcessingDegree_ID: 1, Name: "Raw",        Description: "Original, unmodified data as received from the source" }
    - { ProcessingDegree_ID: 2, Name: "Cleaned",    Description: "Outliers removed and obvious errors corrected" }
    - { ProcessingDegree_ID: 3, Name: "Calibrated", Description: "Calibration corrections applied" }
    - { ProcessingDegree_ID: 4, Name: "Validated",  Description: "Manually reviewed and approved for use" }
    - { ProcessingDegree_ID: 5, Name: "Filtered",   Description: "Signal filtering or smoothing applied" }
    - { ProcessingDegree_ID: 6, Name: "Predicted",  Description: "Values generated by a model or prediction algorithm" }
