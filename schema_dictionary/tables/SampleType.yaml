_format_version: "1.0"
table:
  name: SampleType
  schema: dbo
  description: >
    Controlled dictionary describing the nature of a physical sample.
    Referenced by Sample.SampleType_ID.

  columns:
    - name: SampleType_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Sample type name (e.g. 'Field', 'Blank')"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of what this sample type represents"

  primary_key: [SampleType_ID]

  seed_data:
    - { SampleType_ID: 1, Name: "Field",            Description: "Sample collected from a real-world site or process" }
    - { SampleType_ID: 2, Name: "Synthetic",         Description: "Laboratory-prepared sample with known composition" }
    - { SampleType_ID: 3, Name: "Master Standard",   Description: "Reference standard used to prepare derived standards" }
    - { SampleType_ID: 4, Name: "Derived Standard",  Description: "Dilution or aliquot derived from a master standard" }
    - { SampleType_ID: 5, Name: "Blank",             Description: "Blank sample used to detect contamination or baseline" }
