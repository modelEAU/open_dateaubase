_format_version: "1.0"
table:
  name: SignalInterfacePort
  schema: dbo
  description: >
    A specific physical or logical connection point on a Signal Interface — for example,
    an analog input slot on a controller, an RS-485 serial port on a basestation, or a
    probe socket on a sensor hub. This represents exactly where an instrument is wired in.
    Ports are optional: if you have not yet traced the wiring, a Channel can exist with
    no port assigned and is still addressable by its tag name alone. Multiple sensors can
    share one port (multiplexer case), distinguished by a gating note.

  columns:
    - name: SignalInterfacePort_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: SignalInterface_ID
      logical_type: integer
      nullable: false
      description: "The interface this port belongs to"
      foreign_key:
        table: SignalInterface
        column: SignalInterface_ID

    - name: PortIdentifier
      logical_type: string
      max_length: 100
      nullable: false
      description: "Identifier used by the interface (e.g. 'slot6/Ch0', 'COM2', 'ProbeA')"

    - name: SignalInterfacePortKind_ID
      logical_type: integer
      nullable: false
      description: "Physical kind of port (analog/digital/serial/...)"
      foreign_key:
        table: SignalInterfacePortKind
        column: SignalInterfacePortKind_ID

    - name: Description
      logical_type: text
      nullable: true
      description: "Free-text notes about this port"

    - name: IsActive
      logical_type: boolean
      nullable: false
      default: true
      description: "Whether this port is currently in use"

  indexes:
    - name: UQ_SignalInterfacePort_Interface_PortId
      columns: [SignalInterface_ID, PortIdentifier]
      unique: true
      description: "One port identifier per interface"

  primary_key: [SignalInterfacePort_ID]
