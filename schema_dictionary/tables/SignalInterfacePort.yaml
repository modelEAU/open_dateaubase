_format_version: "1.0"
table:
  name: SignalInterfacePort
  schema: dbo
  description: >
    A physical or logical port on a SignalInterface (e.g. analog input 6
    channel 0 on a PLC rack, an RS-485 port on a basestation). Represents
    the wiring point an Equipment is physically connected to. A Channel is
    NOT required to reference a port — when the wire has not yet been
    traced, Channel.SignalInterfacePort_ID is left NULL and the Channel is
    addressable by (SignalInterface_ID, TagName) alone. Multiple Channels
    can share a single port (multiplexer case, e.g. TresCON), distinguished
    by ChannelPortHistory.GatingNote.

  columns:
    - name: SignalInterfacePort_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: SignalInterface_ID
      logical_type: integer
      nullable: false
      description: "The interface this port belongs to"
      foreign_key:
        table: SignalInterface
        column: SignalInterface_ID

    - name: PortIdentifier
      logical_type: string
      max_length: 100
      nullable: false
      description: "Identifier used by the interface (e.g. 'slot6/Ch0', 'COM2', 'ProbeA')"

    - name: SignalInterfacePortKind_ID
      logical_type: integer
      nullable: false
      description: "Physical kind of port (analog/digital/serial/...)"
      foreign_key:
        table: SignalInterfacePortKind
        column: SignalInterfacePortKind_ID

    - name: Description
      logical_type: text
      nullable: true
      description: "Free-text notes about this port"

    - name: IsActive
      logical_type: boolean
      nullable: false
      default: true
      description: "Whether this port is currently in use"

  indexes:
    - name: UQ_SignalInterfacePort_Interface_PortId
      columns: [SignalInterface_ID, PortIdentifier]
      unique: true
      description: "One port identifier per interface"

  primary_key: [SignalInterfacePort_ID]
