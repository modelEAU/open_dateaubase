_format_version: "1.0"
table:
  name: Parameter
  schema: dbo
  description: "Stores the different water quality or quantity parameters that are measured (e.g., pH, TSS, N-components)"

  columns:
    - name: Parameter_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate key. Manually assigned."
    - name: Parameter
      logical_type: string
      max_length: 100
      nullable: true
      description: "Name of the parameter"
    - name: Description
      logical_type: text
      nullable: true
      description: "Description of the parameter"
    - name: ENVO_IRI
      logical_type: string
      max_length: 256
      nullable: true
      description: "ENVO ontology IRI for the parameter (e.g. http://purl.obolibrary.org/obo/ENVO_01001502)"
    - name: ValueKind_ID
      logical_type: integer
      nullable: false
      default: 1
      description: "Shape of the stored value: FK to ValueKind (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
      foreign_key: { table: ValueKind, column: ValueKind_ID }
    - name: QUDT_QuantityKind_IRI
      logical_type: string
      max_length: 256
      nullable: true
      description: "QUDT quantity kind IRI; used at build time to populate ParameterHasUnit. NULL = no physical quantity kind (status codes, images, spectra)."

  primary_key: [Parameter_ID]

  seed_data:
    - { Parameter: "TSS concentration",              Parameter_ID: 1,  Description: "Total suspended solids",                                             ENVO_IRI: "http://purl.obolibrary.org/obo/ENVO_01001502", ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "COD concentration",              Parameter_ID: 2,  Description: "Chemical oxygen demand",                                             ENVO_IRI: "http://purl.obolibrary.org/obo/ENVO_01000632", ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "pH",                             Parameter_ID: 3,  Description: "Hydrogen ion concentration",                                         ENVO_IRI: "http://purl.obolibrary.org/obo/ENVO_09200019", ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/PH",          manual_units: ["pH units"] }
    - { Parameter: "Temperature",                    Parameter_ID: 4,  Description: "Water temperature",                                                  ENVO_IRI: "http://purl.obolibrary.org/obo/ENVO_01001501", ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/Temperature" }
    - { Parameter: "Conductivity",                   Parameter_ID: 5,  Description: "Electrical conductivity",                                            ENVO_IRI: "http://purl.obolibrary.org/obo/ENVO_09200010", ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/ElectricConductivity" }
    - { Parameter: "Sensor Status",                  Parameter_ID: 6,  Description: "Per-channel operational status code",                                ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: null }
    - { Parameter: "Device Status",                  Parameter_ID: 7,  Description: "Overall equipment health status code",                               ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: null }
    - { Parameter: "Dissolved oxygen concentration", Parameter_ID: 8,  Description: "Dissolved oxygen concentration in water",                            ENVO_IRI: "http://purl.obolibrary.org/obo/ENVO_01001111", ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "Turbidity",                      Parameter_ID: 9,  Description: "Water turbidity measured by nephelometry",                           ENVO_IRI: "http://purl.obolibrary.org/obo/ENVO_01001573", ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/Turbidity" }
    - { Parameter: "Absorbance spectrum",            Parameter_ID: 10, Description: "UV-Vis spectral absorbance (per-wavelength vector, unit AU)",        ENVO_IRI: null,                                           ValueKind_ID: 2, QUDT_QuantityKind_IRI: null,                                              manual_units: ["AU"] }
    - { Parameter: "Ammonium-N concentration",       Parameter_ID: 11, Description: "Ammonium nitrogen concentration (NH4-N)",                            ENVO_IRI: "http://purl.obolibrary.org/obo/CHEBI_49786",   ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "Nitrate-N concentration",        Parameter_ID: 12, Description: "Nitrate nitrogen concentration as NO3-N equivalent",                 ENVO_IRI: "http://purl.obolibrary.org/obo/CHEBI_17632",   ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "COD filtered concentration",     Parameter_ID: 13, Description: "Filtered COD (CODf) — soluble fraction of chemical oxygen demand",   ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "Flow",                           Parameter_ID: 14, Description: "Volumetric flow rate",                                               ENVO_IRI: "http://purl.obolibrary.org/obo/ENVO_01001020", ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/VolumeFlowRate" }
    - { Parameter: "Level",                          Parameter_ID: 15, Description: "Water level / depth",                                                ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/Length" }
    - { Parameter: "floc_morphology",                Parameter_ID: 16, Description: "Activated sludge floc morphology image from inline microscope",      ENVO_IRI: null,                                           ValueKind_ID: 4, QUDT_QuantityKind_IRI: null }
    - { Parameter: "Potassium concentration",        Parameter_ID: 17, Description: "Potassium concentration (K)",                                        ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "Light Absorbance",               Parameter_ID: 18, Description: "Scalar light absorbance measurement",                                ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/Absorbance",  manual_units: ["AU"] }
    - { Parameter: "Nitrite-N concentration",         Parameter_ID: 19, Description: "Nitrite nitrogen concentration (NO2-N)",                              ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "NOx-N concentration",            Parameter_ID: 20, Description: "Total oxidized nitrogen (NO3-N + NO2-N)",                             ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/MassConcentration" }
    - { Parameter: "Air flow",                       Parameter_ID: 21, Description: "Volumetric air/gas flow rate",                                        ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: "http://qudt.org/vocab/quantitykind/VolumeFlowRate",  manual_units: ["Nm³/h"] }
    - { Parameter: "Valve position",                 Parameter_ID: 22, Description: "Control valve analog output position (0-100%)",                       ENVO_IRI: null,                                           ValueKind_ID: 1, QUDT_QuantityKind_IRI: null,                                              manual_units: ["%"] }
