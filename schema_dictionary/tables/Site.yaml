_format_version: "1.0"
table:
  name: Site
  schema: dbo
  description: "Stores general site information, including address, site type, and a link to the associated watershed"

  columns:
    - name: Site_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "A unique ID is generated automatically by the database"
    - name: Watershed_ID
      logical_type: integer
      nullable: true
      description: "Linked to the Watershed table"
      foreign_key:
        table: Watershed
        column: Watershed_ID
    - name: Name
      logical_type: string
      max_length: 100
      nullable: true
      description: "Name of the site"
    - name: Type
      logical_type: string
      max_length: 255
      nullable: true
      description: "For example: \"WWTP\", \"River\" or \"Sewer_system\""
    - name: Description
      logical_type: text
      nullable: true
      description: "Description of the site"
    - name: LatitudeWGS84
      logical_type: float
      nullable: true
      description: "Latitude of the site in WGS84 decimal degrees"
    - name: LongitudeWGS84
      logical_type: float
      nullable: true
      description: "Longitude of the site in WGS84 decimal degrees"
    - name: StreetNumber
      logical_type: string
      max_length: 100
      nullable: true
      description: "Address: number of the street"
    - name: StreetName
      logical_type: string
      max_length: 100
      nullable: true
      description: "Address: name of the street"
    - name: City
      logical_type: string
      max_length: 255
      nullable: true
      description: "Address: name of the city"
    - name: PostCode
      logical_type: string
      max_length: 100
      nullable: true
      description: "Address: postal code"
    - name: Province
      logical_type: string
      max_length: 255
      nullable: true
      description: "Address: name of the province"
    - name: Country
      logical_type: string
      max_length: 255
      nullable: true
      description: "Address: name of the country"

  primary_key: [Site_ID]
