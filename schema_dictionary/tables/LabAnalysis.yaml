_format_version: "1.0"
table:
  name: LabAnalysis
  schema: dbo
  description: >
    One analytical run on a discrete physical sample — the event-record sitting
    at the intersection of two orthogonal grouping axes: LabExperiment (the
    session: who/when) and AnalysisSeries (the stream identity: parameter /
    location / kind / processing / unit). The measurement itself lives in
    Observation (via LabAnalysis_ID) and is routed to a payload table
    (Value / ValueVector / ValueMatrix / ValueImage) so lab data is no longer
    scalar-only. Point-level review state (ReviewStatus_ID, ReviewedByPerson_ID,
    ReviewDateTime) records the institutional approval of each individual
    measurement, parallel to QualityCode_ID; AuditLog covers amendment history.

  columns:
    - name: LabAnalysis_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: LabExperiment_ID
      logical_type: integer
      nullable: false
      description: "The lab session this analysis was part of"
      foreign_key:
        table: LabExperiment
        column: LabExperiment_ID

    - name: AnalysisSeries_ID
      logical_type: integer
      nullable: false
      description: "The measurement stream (parameter / location / value kind) this analysis belongs to"
      foreign_key:
        table: AnalysisSeries
        column: Stream_ID

    - name: Sample_ID
      logical_type: integer
      nullable: false
      description: "The physical sample that was analysed"
      foreign_key:
        table: Sample
        column: Sample_ID

    - name: Replicate
      logical_type: integer
      nullable: false
      default: 1
      description: "Replicate number (1 = primary measurement, 2+ = duplicates)"

    - name: QualityCode_ID
      logical_type: integer
      nullable: true
      description: "Optional quality flag. NULL means no quality assessment has been recorded."
      foreign_key:
        table: QualityCode
        column: QualityCode_ID

    - name: ReviewStatus_ID
      logical_type: integer
      nullable: false
      default: 1
      description: >
        Institutional approval state of this measurement. Defaults to Pending (1)
        at ingest. Review is point-level (per LabAnalysis row), not series-level.
      foreign_key:
        table: ReviewStatus
        column: ReviewStatus_ID

    - name: ReviewedByPerson_ID
      logical_type: integer
      nullable: true
      description: "Person who approved/rejected this measurement. NULL = not yet reviewed."
      foreign_key:
        table: Person
        column: Person_ID

    - name: ReviewDateTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "When the review decision was recorded. NULL = not yet reviewed."

    - name: Laboratory_ID
      logical_type: integer
      nullable: true
      description: "Laboratory where the analysis was performed"
      foreign_key:
        table: Laboratory
        column: Laboratory_ID

    - name: AnalystPerson_ID
      logical_type: integer
      nullable: true
      description: "Person who performed the analysis"
      foreign_key:
        table: Person
        column: Person_ID

    - name: Procedure_ID
      logical_type: integer
      nullable: true
      description: "Standard operating procedure used for this analysis"
      foreign_key:
        table: Procedures
        column: Procedure_ID

    - name: AnalysisDateTime
      logical_type: timestamp
      precision: 7
      nullable: false
      default: SYSUTCDATETIME()
      description: "UTC datetime when the analysis was performed. If it's a long analysis, record the beginning."

    - name: Notes
      logical_type: string
      max_length: max
      nullable: true
      description: "Free-text notes about this analysis run"

  primary_key: [LabAnalysis_ID]
  unique_constraints:
    - name: UQ_LabAnalysis_Identity
      columns: [LabExperiment_ID, AnalysisSeries_ID, Sample_ID, Replicate]
