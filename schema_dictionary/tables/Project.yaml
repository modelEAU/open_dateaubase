_format_version: "1.0"
table:
  name: Project
  schema: dbo
  description: "Top-level grouping entity above Campaign. A Project collects related campaigns under a common objective."

  columns:
    - name: Project_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"
    - name: Name
      logical_type: string
      max_length: 100
      nullable: true
      description: "Name of the project"
    - name: Description
      logical_type: text
      nullable: true
      description: "Description of the project"

  primary_key: [Project_ID]
