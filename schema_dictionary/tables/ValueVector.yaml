_format_version: "1.0"
table:
  name: ValueVector
  schema: dbo
  description: >
    One row per (observation, bin) for vector (spectral) data. Unifies spectra,
    particle size distributions, and any other 1D distribution over a physical axis.
    Channel and Timestamp are resolved via the Observation table.
  columns:
    - name: Observation_ID
      logical_type: integer
      nullable: false
      description: "References the Observation (channel + timestamp) for this measurement"
      foreign_key:
        table: Observation
        column: Observation_ID
    - name: ValueBin_ID
      logical_type: integer
      nullable: false
      description: "References the bin (and through it, the axis) for this value"
      foreign_key:
        table: ValueBin
        column: ValueBin_ID
    - name: Value
      logical_type: float64
      nullable: true
      description: "Measured value at this bin"
    - name: QualityCode
      logical_type: integer
      nullable: true
      description: "Quality flag for this measurement"
  primary_key: [Observation_ID, ValueBin_ID]
