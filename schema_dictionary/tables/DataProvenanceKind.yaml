_format_version: "1.0"
table:
  name: DataProvenanceKind
  schema: dbo
  description: "Controlled vocabulary describing how a measurement was produced (Sensor, Laboratory, Manual Entry, Model Output, External Source, Forecast)"

  columns:
    - name: DataProvenanceKind_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Name of the provenance kind"

    - name: Description
      logical_type: string
      max_length: 300
      nullable: true
      description: "Explanation of how data with this provenance was produced"

  primary_key: [DataProvenanceKind_ID]

  seed_data:
    - { DataProvenanceKind_ID: 1, Name: "Sensor",               Description: "Value acquired directly from an instrument or sensor in the field" }
    - { DataProvenanceKind_ID: 2, Name: "Laboratory",           Description: "Value determined by laboratory chemical or physical analysis" }
    - { DataProvenanceKind_ID: 3, Name: "Controller Output",    Description: "Value generated by a control algorithm." }
    - { DataProvenanceKind_ID: 4, Name: "Model Output",         Description: "Value generated by a simulation, model, or prediction algorithm not involved in control." }
    - { DataProvenanceKind_ID: 5, Name: "External Source",      Description: "Value imported from an external dataset or third-party system" }
    - { DataProvenanceKind_ID: 6, Name: "Forecast",             Description: "Future-dated value produced by a forecasting model" }
