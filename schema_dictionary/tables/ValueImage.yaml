_format_version: "1.0"
table:
  name: ValueImage
  schema: dbo
  description: >
    Image measurement payload for a single Observation. One row per Observation of
    DataType='Image'. Stores metadata about image dimensions, format, and storage
    location. Channel and Timestamp are resolved via the Observation table.
  columns:
    - name: Observation_ID
      logical_type: integer
      nullable: false
      description: >
        Links this image to its Observation (channel + timestamp).
        Acts as both PK and FK — one image per observation.
      foreign_key:
        table: Observation
        column: Observation_ID
    - name: ImageWidth
      logical_type: integer
      nullable: false
      description: "Width of the image in pixels"
    - name: ImageHeight
      logical_type: integer
      nullable: false
      description: "Height of the image in pixels"
    - name: NumberOfChannels
      logical_type: integer
      nullable: false
      default: 3
      description: "Number of color channels (e.g. 3 for RGB, 1 for grayscale)"
    - name: ImageFormat
      logical_type: string
      max_length: 20
      nullable: false
      description: "Image file format (e.g. PNG, TIFF, JPEG)"
    - name: FileSizeBytes
      logical_type: biginteger
      nullable: true
      description: "File size in bytes"
    - name: StorageBackend
      logical_type: string
      max_length: 50
      nullable: false
      default: "'FileSystem'"
      description: "Storage backend type (e.g. FileSystem, S3, Azure Blob)"
    - name: StoragePath
      logical_type: string
      max_length: 1000
      nullable: false
      description: "Full path or URI to the stored image file"
    - name: Thumbnail
      logical_type: binary_large
      nullable: true
      description: "Optional thumbnail image stored inline as binary"
    - name: QualityCode
      logical_type: integer
      nullable: true
      description: "Quality flag for this image"
  primary_key: [Observation_ID]
