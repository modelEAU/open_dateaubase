_format_version: "1.0"
table:
  name: DataAcquisitionSystemKind
  schema: dbo
  description: "Controlled vocabulary for categories of Data Acquisition Systems"

  columns:
    - name: DataAcquisitionSystemKind_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: Name
      logical_type: string
      max_length: 100
      nullable: false
      description: "Human-readable name of the DAS category"

    - name: Description
      logical_type: string
      max_length: 500
      nullable: true
      description: "Explanation of what this category of DAS represents"

  primary_key: [DataAcquisitionSystemKind_ID]

  seed_data:
    - { DataAcquisitionSystemKind_ID: 1, Name: "SCADA",         Description: "Supervisory Control and Data Acquisition system" }
    - { DataAcquisitionSystemKind_ID: 2, Name: "PLC",           Description: "Programmable Logic Controller" }
    - { DataAcquisitionSystemKind_ID: 3, Name: "Datalogger",    Description: "Dedicated field data logger (e.g. Campbell, CR1000)" }
    - { DataAcquisitionSystemKind_ID: 4, Name: "IoT Gateway",   Description: "Internet-of-Things gateway aggregating sensor streams" }
    - { DataAcquisitionSystemKind_ID: 5, Name: "Manual entry",  Description: "Data entered manually by an operator (spreadsheet, form)" }
    - { DataAcquisitionSystemKind_ID: 6, Name: "Other",         Description: "System type not covered by the other categories" }
