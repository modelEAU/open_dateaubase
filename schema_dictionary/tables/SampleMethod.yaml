_format_version: "1.0"
table:
  name: SampleMethod
  schema: dbo
  description: >
    Controlled dictionary describing how a sample was collected.
    Referenced by Sample.SampleMethod_ID.

  columns:
    - name: SampleMethod_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Collection method name (e.g. 'Grab', 'Composite24h')"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of the collection method"

  primary_key: [SampleMethod_ID]

  seed_data:
    - { SampleMethod_ID: 1, Name: "Grab",          Description: "Single instantaneous sample collected at one point in time" }
    - { SampleMethod_ID: 2, Name: "Composite24h",  Description: "Flow- or time-proportional composite over a 24-hour period" }
    - { SampleMethod_ID: 3, Name: "Composite8h",   Description: "Flow- or time-proportional composite over an 8-hour period" }
    - { SampleMethod_ID: 4, Name: "Passive",        Description: "Passive sampler deployed over an extended exposure period" }
    - { SampleMethod_ID: 5, Name: "Other",          Description: "Collection method not covered by the standard vocabulary" }
