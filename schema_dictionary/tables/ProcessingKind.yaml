_format_version: "1.0"
table:
  name: ProcessingKind
  schema: dbo
  description: >
    Controlled vocabulary describing the level of processing applied to a Channel's
    time series. A new Channel row is created each time the processing kind changes —
    this field is set once at row creation. The DataLineage graph is the authoritative
    record of how each Channel was derived; this field exists for fast filtering.

  columns:
    - name: ProcessingKind_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Processing level name (e.g. 'Raw', 'Cleaned')"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of what this processing level means"

  primary_key: [ProcessingKind_ID]

  seed_data:
    - { ProcessingKind_ID: 1, Name: "Raw",        Description: "Original, unmodified data as received from the source" }
    - { ProcessingKind_ID: 2, Name: "Cleaned",    Description: "Outliers removed and obvious errors corrected" }
    - { ProcessingKind_ID: 3, Name: "Calibrated", Description: "Calibration corrections applied" }
    - { ProcessingKind_ID: 4, Name: "Validated",  Description: "Manually reviewed and approved for use" }
    - { ProcessingKind_ID: 5, Name: "Filtered",   Description: "Signal filtering or smoothing applied" }
    - { ProcessingKind_ID: 6, Name: "Predicted",  Description: "Values generated by a model or prediction algorithm" }
