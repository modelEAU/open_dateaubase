_format_version: "1.0"
table:
  name: ProcessingKind
  schema: dbo
  description: >
    Controlled vocabulary describing the level of processing applied to a Channel's
    time series. A new Channel row is created each time the processing kind changes —
    this field is set once at row creation. The DataLineage graph is the authoritative
    record of how each Channel was derived; this field exists for fast filtering.

  columns:
    - name: ProcessingKind_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Processing level name (e.g. 'Raw', 'Cleaned')"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of what this processing level means"

  primary_key: [ProcessingKind_ID]

  seed_data:
    - { ProcessingKind_ID: 1, Name: "Raw",               Description: "Original, unmodified data as received from the source" }
    - { ProcessingKind_ID: 2, Name: "Free of outliers",  Description: "Spikes and statistical outliers have been removed or flagged" }
    - { ProcessingKind_ID: 3, Name: "Free of drift",     Description: "Sensor drift or baseline shift has been corrected" }
    - { ProcessingKind_ID: 4, Name: "Free of faults",    Description: "Instrument faults and implausible values have been removed" }
    - { ProcessingKind_ID: 5, Name: "Smoothed",          Description: "Noise reduced by a smoothing or averaging algorithm" }
    - { ProcessingKind_ID: 6, Name: "Interpolated",      Description: "Missing values filled by interpolation" }
    - { ProcessingKind_ID: 7, Name: "Predicted",         Description: "Values generated by a predictive model or algorithm" }
    - { ProcessingKind_ID: 8, Name: "Derived",           Description: "Computed from one or more other channels (e.g. dimensionality reduction, transformation)" }
