_format_version: "1.0"
table:
  name: ChannelRole
  schema: dbo
  description: >
    Controlled vocabulary describing what kind of information a Channel
    carries (Value / Status / Alarm / Uncertainty). Replaces the former
    SignalPortType lookup. Sub-signals (Status, Alarm, Uncertainty) attach
    to their parent value Channel via Channel.ParentChannel_ID.

  columns:
    - name: ChannelRole_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Short name for this role"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of what this role means"

  primary_key: [ChannelRole_ID]

  seed_data:
    - { ChannelRole_ID: 1, Name: "Value",       Description: "Primary measurement or output value" }
    - { ChannelRole_ID: 2, Name: "Status",      Description: "Device or measurement status flag" }
    - { ChannelRole_ID: 3, Name: "Alarm",       Description: "Alarm or alert indicator" }
    - { ChannelRole_ID: 4, Name: "Uncertainty", Description: "Measurement uncertainty estimate" }
