_format_version: "1.0"
table:
  name: SignalPortEquipmentHistory
  schema: dbo
  description: >
    Temporal record of which physical instrument (Equipment) is behind a SignalPort.
    When a sensor probe is replaced, close the current row (set EndTime) and open
    a new row for the replacement instrument. Equipment_ID may be NULL when the
    physical instrument is unknown at ingest time.
    At most one row per port may have EndTime IS NULL (the "currently installed" instrument).

  columns:
    - name: SignalPortEquipmentHistory_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: SignalPort_ID
      logical_type: integer
      nullable: false
      description: "The port to which this equipment is linked"
      foreign_key:
        table: SignalPort
        column: SignalPort_ID

    - name: Equipment_ID
      logical_type: integer
      nullable: true
      description: "The physical instrument behind this port during this period. NULL = unknown at ingest time."
      foreign_key:
        table: Equipment
        column: Equipment_ID

    - name: StartTime
      logical_type: timestamp
      precision: 7
      nullable: false
      description: "UTC datetime when this equipment started serving this port"

    - name: EndTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "UTC datetime when this equipment stopped serving this port. NULL = currently installed."

    - name: Notes
      logical_type: text
      nullable: true
      description: "Free-text notes (e.g. reason for swap, calibration context)"

  indexes:
    - name: UQ_SignalPortEquipmentHistory_ActiveRow
      columns: [SignalPort_ID]
      unique: true
      description: "At most one active (EndTime IS NULL) equipment row per port. Filtered index."

  primary_key: [SignalPortEquipmentHistory_ID]
