_format_version: "1.0"
table:
  name: Equipment
  schema: dbo
  description: >
    Stores information about a specific physical piece of equipment (e.g., serial number,
    owner, purchase date, storage location). Equipment is linked to measurement streams
    via SignalPortEquipmentHistory (not directly via Channel), allowing instrument swaps
    without breaking data continuity.

  columns:
    - name: Equipment_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"
    - name: EquipmentModel_ID
      logical_type: integer
      nullable: true
      description: "Link to the Equipment model table"
      foreign_key:
        table: EquipmentModel
        column: EquipmentModel_ID
    - name: Identifier
      logical_type: string
      max_length: 100
      nullable: true
      description: "Identification name of the equipment"
    - name: SerialNumber
      logical_type: string
      max_length: 100
      nullable: true
      description: "Serial number of the equipment"
    - name: Owner
      logical_type: text
      nullable: true
      description: "Name of the owner of the equipment"
    - name: StorageLocation
      logical_type: string
      max_length: 100
      nullable: true
      description: "Where the equipment is stored when not deployed"
    - name: PurchaseDate
      logical_type: date
      nullable: true
      description: "Date when the equipment was bought: 'YYYY-MM-DD'"
    - name: IsActive
      logical_type: boolean
      nullable: false
      default: true
      description: >
        Whether this equipment is currently in service. Set to false when decommissioned.
        Decommissioning should also be recorded as an EquipmentEvent for auditability.
        Enables fast active/inactive filtering without inspecting SignalPortEquipmentHistory.

  primary_key: [Equipment_ID]
