_format_version: "1.0"
table:
  name: EquipmentModel
  schema: dbo
  description: "Stores detailed, non-redundant specifications for a specific sensor or instrument model (e.g., manufacturer, functions, method)"

  columns:
    - name: EquipmentModel_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Link to the Equipment model table"
    - name: EquipmentModel
      logical_type: string
      max_length: 100
      nullable: true
      description: "Name of the equipment model. For example: ammo::lyser"
    - name: Method
      logical_type: string
      max_length: 100
      nullable: true
      description: "Method behind the equipment"
    - name: Functions
      logical_type: text
      nullable: true
      description: "Description of the functions of the equipment"
    - name: Manufacturer
      logical_type: string
      max_length: 100
      nullable: true
      description: "Name of the manufacturer"
    - name: ManualLocation
      logical_type: string
      max_length: 1000
      nullable: true
      description: "Location where the manual is stored (e.g. a SharePoint URL)"

  primary_key: [EquipmentModel_ID]
