_format_version: "1.0"
table:
  name: AnalysisSeries
  schema: dbo
  description: >
    Stable stream identity for lab measurements — the lab analogue of Channel.
    One AnalysisSeries row represents the conceptual stream of "Parameter X
    measured at SamplingPoint Y by ProcessingKind Z producing ValueKind W in
    Unit U" (e.g. "TSS Gravimetric at Effluent in mg/L"). All LabAnalyses
    measuring the same parameter at the same location with the same processing
    and value kind share one AnalysisSeries_ID, giving lab data a queryable
    time-series identity.

    Unlike Channel — which intentionally excludes sampling location from its
    identity because location is inferred at query time via
    EquipmentLocationHistory — AnalysisSeries includes SamplingPoint_ID as
    explicit identity, because lab samples always have a known origin and
    "TSS at Influent" must be a different series from "TSS at Effluent".

  columns:
    - name: AnalysisSeries_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: Name
      logical_type: string
      max_length: 200
      nullable: false
      description: "Human-readable label (e.g. 'TSS Gravimetric at Effluent')"

    - name: Parameter_ID
      logical_type: integer
      nullable: false
      description: "Measured analyte (e.g. TSS concentration, COD concentration)"
      foreign_key:
        table: Parameter
        column: Parameter_ID

    - name: SamplingPoint_ID
      logical_type: integer
      nullable: false
      description: "Sampling point where the samples for this series originate"
      foreign_key:
        table: SamplingPoint
        column: SamplingPoint_ID

    - name: ValueKind_ID
      logical_type: integer
      nullable: false
      default: 1
      description: "Shape of stored values (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
      foreign_key:
        table: ValueKind
        column: ValueKind_ID

    - name: Unit_ID
      logical_type: integer
      nullable: false
      description: >
        Unit of measurement for values in this series (e.g. mg/L). Treated as
        immutable for the lifetime of the series — a unit change requires a new
        AnalysisSeries row. Excluded from the uniqueness constraint because
        unit choice is a property of the series rather than part of its identity;
        two series with the same parameter / location / processing / value kind
        cannot legitimately differ only by unit.
      foreign_key:
        table: Unit
        column: Unit_ID

    - name: ProcessingKind_ID
      logical_type: integer
      nullable: false
      default: 1
      description: >
        How values in this series were produced (1=Raw, ...). Supports raw vs.
        corrected lab series for the same parameter at the same location.
      foreign_key:
        table: ProcessingKind
        column: ProcessingKind_ID

    - name: Description
      logical_type: string
      max_length: max
      nullable: true
      description: "Free-text notes about this analysis series"

  primary_key: [AnalysisSeries_ID]
  unique_constraints:
    - name: UQ_AnalysisSeries_Identity
      columns: [Parameter_ID, SamplingPoint_ID, ValueKind_ID, ProcessingKind_ID]
