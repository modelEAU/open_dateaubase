_format_version: "1.0"
table:
  name: AnalysisSeries
  schema: dbo
  description: >
    Stable stream identity for lab measurements — the lab subtype of Stream
    (table-per-type inheritance): it shares Stream_ID as its own primary key,
    which is simultaneously a foreign key to Stream.Stream_ID. Each
    AnalysisSeries owns exactly one Stream row carrying this same identifier.
    One AnalysisSeries row represents the conceptual stream of "Parameter X
    measured at SamplingPoint Y producing ValueKind W in Unit U"
    (e.g. "TSS at Effluent in mg/L"). All LabAnalyses measuring the same
    parameter at the same location with the same value kind, produced by the
    same laboratory, share one Stream_ID, giving lab data a queryable
    time-series identity. Laboratory is part of that identity: results from
    two laboratories are not interchangeable, so they form two series.

    Unlike Channel — which intentionally excludes sampling location from its
    identity because location is inferred at query time via
    EquipmentLocationHistory — AnalysisSeries includes SamplingPoint_ID as
    explicit identity, because lab samples always have a known origin and
    "TSS at Influent" must be a different series from "TSS at Effluent".

    Review status is a point-level attribute on LabAnalysis (added in a later
    slice), not part of series identity: all measurements of the same parameter
    at the same location share one AnalysisSeries regardless of review state.

  columns:
    - name: Stream_ID
      logical_type: integer
      nullable: false
      identity: false
      description: >
        Shared primary key (table-per-type inheritance): both the primary
        key of AnalysisSeries and a foreign key to Stream.Stream_ID. Every
        AnalysisSeries owns exactly one Stream row carrying this same identifier.
      foreign_key:
        table: Stream
        column: Stream_ID

    - name: Name
      logical_type: string
      max_length: 200
      nullable: false
      description: "Human-readable label (e.g. 'TSS Gravimetric at Effluent')"

    - name: Parameter_ID
      logical_type: integer
      nullable: false
      description: "Measured analyte (e.g. TSS concentration, COD concentration)"
      foreign_key:
        table: Parameter
        column: Parameter_ID

    - name: SamplingPoint_ID
      logical_type: integer
      nullable: false
      description: "Sampling point where the samples for this series originate"
      foreign_key:
        table: SamplingPoint
        column: SamplingPoint_ID

    - name: ValueKind_ID
      logical_type: integer
      nullable: false
      default: 1
      description: "Shape of stored values (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
      foreign_key:
        table: ValueKind
        column: ValueKind_ID

    - name: Unit_ID
      logical_type: integer
      nullable: false
      description: >
        Unit of measurement for values in this series (e.g. mg/L). Treated as
        immutable for the lifetime of the series — a unit change requires a new
        AnalysisSeries row. Excluded from the uniqueness constraint because
        unit choice is a property of the series rather than part of its identity;
        two series with the same parameter / location / value kind cannot
        legitimately differ only by unit.
      foreign_key:
        table: Unit
        column: Unit_ID

    - name: Laboratory_ID
      logical_type: integer
      nullable: true
      description: >
        Laboratory that produces this series. Part of series identity: two
        laboratories measuring the same parameter at the same sampling point
        are two separate series, because their results are not interchangeable.
        NULL means the producing laboratory is unrecorded.
      foreign_key:
        table: Laboratory
        column: Laboratory_ID

    - name: Campaign_ID
      logical_type: integer
      nullable: true
      description: "Campaign this series belongs to; scopes the series to a specific monitoring campaign"
      foreign_key:
        table: Campaign
        column: Campaign_ID

    - name: Description
      logical_type: string
      max_length: max
      nullable: true
      description: "Free-text notes about this analysis series"

  primary_key: [Stream_ID]
  unique_constraints:
    - name: UQ_AnalysisSeries_Identity
      columns: [Parameter_ID, SamplingPoint_ID, ValueKind_ID, Laboratory_ID]
