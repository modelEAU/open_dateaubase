_format_version: "1.0"
table:
  name: Observation
  schema: dbo
  description: >
    Shared hub table representing a single measurement event on a channel at a
    timestamp. The four payload tables (Value, ValueVector, ValueMatrix, ValueImage)
    carry only their type-specific data, keyed by Observation_ID. DataType mirrors
    Channel.ValueType_ID for self-description.
  columns:
    - name: Observation_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate key; auto-assigned by the database"
    - name: Channel_ID
      logical_type: integer
      nullable: false
      description: "The channel this observation belongs to."
      foreign_key:
        table: Channel
        column: Channel_ID
    - name: Timestamp
      logical_type: timestamp
      precision: 7
      nullable: false
      description: "UTC timestamp of the observation"
    - name: ValueKind_ID
      logical_type: integer
      nullable: false
      description: "Payload kind (1=Scalar, 2=Vector, 3=Matrix, 4=Image). Must match the Channel's ValueKind."
      foreign_key:
        table: ValueKind
        column: ValueKind_ID
  primary_key: [Observation_ID]
  unique_constraints:
    - name: UQ_Observation_ChannelTimestampValueKind
      columns: [Channel_ID, Timestamp, ValueKind_ID]
