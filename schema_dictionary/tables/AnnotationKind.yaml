_format_version: "1.0"
table:
  name: AnnotationKind
  schema: dbo
  description: >
    Controlled vocabulary of verdicts that can be passed on time series data.
    An annotation says what is wrong with the data, never why — the why lives on
    the Event it optionally cites via Event_ID (see ADR-0007). Cause-named kinds
    belong in EventKind. Each kind has a display color for UI rendering.

  columns:
    - name: AnnotationKind_ID
      logical_type: integer
      nullable: false
      description: "Primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 100
      nullable: false
      description: "Human-readable name of the annotation kind"

    - name: Description
      logical_type: string
      max_length: 500
      nullable: true
      description: "Explanation of when to use this annotation kind"

    - name: Color
      logical_type: string
      max_length: 7
      nullable: true
      description: "Hex color code for UI rendering, e.g. '#FF6B6B'"

  primary_key: [AnnotationKind_ID]

  # Five verdicts, per ADR-0007. IDs are not renumbered: 1/2/3/5/6/11 were the
  # retired cause-named kinds and stay burned so old rows never silently change
  # meaning.
  seed_data:
    - { AnnotationKind_ID: 4,  Name: "Anomaly",      Description: "Unexplained behaviour — something happened here that no known event accounts for", Color: "#FF69B4" }
    - { AnnotationKind_ID: 7,  Name: "Data Quality", Description: "Suspect data quality (drift, fouling); cite the Event that caused it if known",    Color: "#AA44FF" }
    - { AnnotationKind_ID: 8,  Name: "Note",         Description: "General commentary",                                                               Color: "#888888" }
    - { AnnotationKind_ID: 9,  Name: "Exclusion",    Description: "Data should be excluded from analysis",                                            Color: "#CC0000" }
    - { AnnotationKind_ID: 10, Name: "Confirmed",    Description: "Data has been reviewed and accepted as valid",                                     Color: "#00AA00" }
