_format_version: "1.0"
table:
  name: StreamKind
  schema: dbo
  description: >
    Controlled vocabulary discriminating the subtype of a Stream:
    a sensor measurement stream (Channel) or a laboratory measurement
    stream (AnalysisSeries). Used as the StreamKind_ID discriminator on
    Stream to enable fast "sensor vs lab" filtering without joining the
    subtype tables.

  columns:
    - name: StreamKind_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Short code name (e.g. 'Sensor', 'Lab')"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of what this stream kind means"

  primary_key: [StreamKind_ID]

  seed_data:
    - { StreamKind_ID: 1, Name: "Sensor", Description: "A sensor measurement stream (Channel subtype of Stream)" }
    - { StreamKind_ID: 2, Name: "Lab",    Description: "A laboratory measurement stream (AnalysisSeries subtype of Stream)" }
