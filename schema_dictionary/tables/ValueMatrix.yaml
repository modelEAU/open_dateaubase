_format_version: "1.0"
table:
  name: ValueMatrix
  schema: dbo
  description: >
    One row per (observation, row-bin, col-bin) for 2D matrix data. Supports joint
    distributions such as particle size-velocity. Channel and Timestamp are resolved
    via the Observation table.
  columns:
    - name: Observation_ID
      logical_type: integer
      nullable: false
      description: "References the Observation (channel + timestamp) for this measurement"
      foreign_key:
        table: Observation
        column: Observation_ID
    - name: RowValueBin_ID
      logical_type: integer
      nullable: false
      description: "References the bin on the row axis (AxisRole=0)"
      foreign_key:
        table: ValueBin
        column: ValueBin_ID
        constraint_name: FK_ValueMatrix_RowValueBin
    - name: ColValueBin_ID
      logical_type: integer
      nullable: false
      description: "References the bin on the column axis (AxisRole=1)"
      foreign_key:
        table: ValueBin
        column: ValueBin_ID
        constraint_name: FK_ValueMatrix_ColValueBin
    - name: Value
      logical_type: float64
      nullable: true
      description: "Measured value at this (row-bin, col-bin) cell"
    - name: QualityCode
      logical_type: integer
      nullable: true
      description: "Quality flag for this measurement"
  primary_key: [Observation_ID, RowValueBin_ID, ColValueBin_ID]
