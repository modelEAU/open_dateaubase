_format_version: "1.0"
table:
  name: ControlLoopPort
  schema: dbo
  description: >
    Association between a ControlLoop and its participating Streams (any
    time-series identity — a sensor Channel or a lab AnalysisSeries), with an
    explicit role for each stream. The unique constraint ensures each stream
    appears at most once per loop. Cascade control is modelled by using the
    same Stream_ID in two different loops with different roles
    (ManipulatedVariable in outer, SetPoint in inner).

  columns:
    - name: ControlLoopPort_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: ControlLoop_ID
      logical_type: integer
      nullable: false
      description: "The control loop this association belongs to"
      foreign_key:
        table: ControlLoop
        column: ControlLoop_ID

    - name: Stream_ID
      logical_type: integer
      nullable: false
      description: "The Stream (sensor Channel or lab AnalysisSeries) participating in this control loop"
      foreign_key:
        table: Stream
        column: Stream_ID

    - name: ControlLoopPortKind_ID
      logical_type: integer
      nullable: false
      description: "The functional kind of this stream within the loop"
      foreign_key:
        table: ControlLoopPortKind
        column: ControlLoopPortKind_ID

  indexes:
    - name: UQ_ControlLoopPort_LoopStream
      columns: [ControlLoop_ID, Stream_ID]
      unique: true
      description: "Each stream appears at most once per control loop"

  primary_key: [ControlLoopPort_ID]
