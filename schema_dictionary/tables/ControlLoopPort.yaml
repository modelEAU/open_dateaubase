_format_version: "1.0"
table:
  name: ControlLoopPort
  schema: dbo
  description: >
    Association between a ControlLoop and its SignalPorts, with an explicit role for
    each port. The unique constraint ensures each port appears at most once per loop.
    Cascade control is modelled by using the same SignalPort_ID in two different loops
    with different roles (ManipulatedVariable in outer, SetPoint in inner).

  columns:
    - name: ControlLoopPort_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: ControlLoop_ID
      logical_type: integer
      nullable: false
      description: "The control loop this association belongs to"
      foreign_key:
        table: ControlLoop
        column: ControlLoop_ID

    - name: SignalPort_ID
      logical_type: integer
      nullable: false
      description: "The port participating in this control loop"
      foreign_key:
        table: SignalPort
        column: SignalPort_ID

    - name: ControlLoopPortRole_ID
      logical_type: integer
      nullable: false
      description: "The functional role of this port within the loop"
      foreign_key:
        table: ControlLoopPortRole
        column: ControlLoopPortRole_ID

  indexes:
    - name: UQ_ControlLoopPort_LoopPort
      columns: [ControlLoop_ID, SignalPort_ID]
      unique: true
      description: "Each port appears at most once per control loop"

  primary_key: [ControlLoopPort_ID]
