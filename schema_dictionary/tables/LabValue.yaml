_format_version: "1.0"
table:
  name: LabValue
  schema: dbo
  description: >
    A single measured value from a lab analysis, for a specific parameter and unit.
    Multiple LabValue rows belong to one LabAnalysis (one value per parameter per replicate).

  columns:
    - name: LabValue_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: LabAnalysis_ID
      logical_type: integer
      nullable: false
      description: "The analysis run this value belongs to"
      foreign_key:
        table: LabAnalysis
        column: LabAnalysis_ID

    - name: Parameter_ID
      logical_type: integer
      nullable: false
      description: "Measured analyte (e.g. TSS, COD)"
      foreign_key:
        table: Parameter
        column: Parameter_ID
    
    - name: LabResult
      logical_type: float64
      nullable: false
      description: "Numerical result of the measurement"

    - name: Replicate
      logical_type: integer
      nullable: false
      default: 1
      description: "Replicate number (1 = primary measurement, 2+ = duplicates)"

    - name: QualityCode_ID
      logical_type: integer
      nullable: true
      description: "Optional quality flag. NULL means no quality assessment has been recorded."
      foreign_key:
        table: QualityCode
        column: QualityCode_ID

    - name: Comment
      logical_type: string
      max_length: max
      nullable: true
      description: "Optional free-text comment reference"

  primary_key: [LabValue_ID]
