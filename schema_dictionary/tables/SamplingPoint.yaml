_format_version: "1.0"
table:
  name: SamplingPoint
  schema: dbo
  description: "Stores the identification, specific geographical coordinates (Latitude/Longitude/GPS), and description of a particular spot where a sample or measurement is taken"

  columns:
    - name: SamplingPoint_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Link to the SamplingPoint table"
    - name: Site_ID
      logical_type: integer
      nullable: false
      description: "Site this sampling point belongs to"
      foreign_key:
        table: Site
        column: Site_ID
    - name: SamplingPoint
      logical_type: string
      max_length: 100
      nullable: false
      description: "Name of the sampling location. For example: \"Inlet\", \"Outlet\" or \"Upstream\""
    - name: SamplingLocation
      logical_type: string
      max_length: 100
      nullable: true
      description: "Where the sample was taken. For example: \"Biofiltration\", \"Sewer 01\" or \"Retention Tank\""
    - name: LatitudeWGS84
      logical_type: float
      nullable: true
      description: "WGS84 latitude in decimal degrees. For example: 45.9070"
    - name: LongitudeWGS84
      logical_type: float
      nullable: true
      description: "WGS84 longitude in decimal degrees. For example: -73.7833"
    - name: Description
      logical_type: text
      nullable: true
      description: "Description of the sampling point"
    - name: PicturePath
      logical_type: string
      max_length: 500
      nullable: true
      description: "Relative path to the sampling point reference photo on disk (e.g. sampling_points/42_abc123.jpg)"
    - name: ValidFrom
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "Date from which this sampling point record is considered valid (UTC). NULL means valid from the beginning of records."
    - name: ValidTo
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "Date until which this sampling point record is valid (UTC). NULL means currently active."
    - name: ProcessUnit_ID
      logical_type: integer
      nullable: true
      description: "Optional process unit this sampling point is located within (e.g. a tank or zone)"
      foreign_key:
        table: ProcessUnit
        column: ProcessUnit_ID
    - name: CreatedByCampaign_ID
      logical_type: integer
      nullable: true
      description: "Campaign during which this sampling point was first established (if applicable)"
      foreign_key:
        table: Campaign
        column: Campaign_ID

  primary_key: [SamplingPoint_ID]
