_format_version: "1.0"
table:
  name: ControlLoopPortRole
  schema: dbo
  description: >
    Controlled vocabulary for the functional role of a SignalPort within a ControlLoop.
    'Other' is an explicit escape hatch for novel control schemes;
    its use should be accompanied by a description in ControlLoop.Description.

  columns:
    - name: ControlLoopPortRole_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Short name for this role"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of the role within a control loop"

  primary_key: [ControlLoopPortRole_ID]

  seed_data:
    - { ControlLoopPortRole_ID: 1, Name: "MeasuredVariable",    Description: "The controlled or observed process variable" }
    - { ControlLoopPortRole_ID: 2, Name: "ManipulatedVariable", Description: "The actuator or output adjusted by the controller" }
    - { ControlLoopPortRole_ID: 3, Name: "SetPoint",            Description: "Target value supplied to the controller" }
    - { ControlLoopPortRole_ID: 4, Name: "Disturbance",         Description: "Measured input that affects the process; not manipulated" }
    - { ControlLoopPortRole_ID: 5, Name: "PredictedOutput",     Description: "Model-predicted value of the controlled variable" }
    - { ControlLoopPortRole_ID: 6, Name: "Other",               Description: "Escape hatch for novel roles; describe in ControlLoop.Description" }
