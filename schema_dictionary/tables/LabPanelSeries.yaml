_format_version: "1.0"
table:
  name: LabPanelSeries
  schema: dbo
  description: >
    Junction table linking a LabPanel to the AnalysisSeries it prescribes.
    When a user creates an experiment "from panel", all series listed here are
    pre-populated into the session.

  columns:
    - name: LabPanel_ID
      logical_type: integer
      nullable: false
      description: "References the panel (FK)"
      foreign_key:
        table: LabPanel
        column: LabPanel_ID

    - name: AnalysisSeries_ID
      logical_type: integer
      nullable: false
      description: "References an analysis series to include in the panel"
      foreign_key:
        table: AnalysisSeries
        column: AnalysisSeries_ID

  primary_key: [LabPanel_ID, AnalysisSeries_ID]
