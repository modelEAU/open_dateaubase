_format_version: "1.0"
table:
  name: ControlVariableType
  schema: dbo
  description: >
    Controlled vocabulary describing a SignalPort's engineering role in the physical
    process. Answers "what does this port do in the process?" — orthogonal to
    SignalPortType which answers "what kind of data flows here?".
    A DO sensor port has ControlVariableType=MeasuredVariable and SignalPortType=Value.
    NULL means unclassified.

  columns:
    - name: ControlVariableType_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Short name for this control variable type"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of the engineering role"

  primary_key: [ControlVariableType_ID]

  seed_data:
    - { ControlVariableType_ID: 1, Name: "MeasuredVariable",    Description: "The variable being controlled or monitored" }
    - { ControlVariableType_ID: 2, Name: "ManipulatedVariable", Description: "The variable adjusted by the controller to affect the process" }
    - { ControlVariableType_ID: 3, Name: "SetPoint",            Description: "Target value the controller tries to achieve" }
    - { ControlVariableType_ID: 4, Name: "Disturbance",         Description: "Measured input that affects the process but is not manipulated" }
    - { ControlVariableType_ID: 5, Name: "Computed",            Description: "Derived or calculated signal within the control scheme" }
