_format_version: "1.0"
table:
  name: Value
  schema: dbo
  description: >
    Scalar payload for a single Observation. One row per Observation of
    DataType='Scalar'. Channel and Timestamp are resolved via the Observation table.
  columns:
    - name: Observation_ID
      logical_type: integer
      nullable: false
      description: "Links this scalar value to its Observation (channel + timestamp)"
      foreign_key:
        table: Observation
        column: Observation_ID
    - name: Value
      logical_type: float64
      nullable: true
      description: "Measured scalar value"
    - name: QualityCode
      logical_type: integer
      nullable: true
      description: "Quality flag for this scalar measurement (references QualityCode.QualityCode_ID)"
  primary_key: [Observation_ID]
