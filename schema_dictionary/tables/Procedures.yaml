_format_version: "1.0"
table:
  name: Procedures
  schema: dbo
  description: "Stores details for different measurement procedures (e.g., calibration, validation, standard operating procedures, ISO methods)"

  columns:
    - name: Procedure_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Link to the Procedures table"
    - name: ProcedureName
      logical_type: string
      max_length: 100
      nullable: true
      description: "Title name of the procedure"
    - name: ProcedureKind_ID
      logical_type: integer
      nullable: true
      description: "FK to ProcedureKind — controlled vocabulary for the type of procedure"
      foreign_key:
        table: ProcedureKind
        column: ProcedureKind_ID
    - name: Description
      logical_type: text
      nullable: true
      description: "Description of the procedure"
    - name: ProcedureLocation
      logical_type: string
      max_length: 100
      nullable: true
      description: "Where is the procedure stored (URL)"

  primary_key: [Procedure_ID]
