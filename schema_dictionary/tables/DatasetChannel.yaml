_format_version: "1.0"
table:
  name: DatasetChannel
  schema: dbo
  description: >
    Junction table linking Datasets to the Channels they contain.
    A Dataset groups one or more Channels that are processed together.
    A Channel may appear in multiple Datasets (e.g. a raw TSS channel
    used as input in several independent analysis pipelines).

  columns:
    - name: Dataset_ID
      logical_type: integer
      nullable: false
      description: "The dataset this channel belongs to"
      foreign_key:
        table: Dataset
        column: Dataset_ID

    - name: Channel_ID
      logical_type: integer
      nullable: false
      description: "The channel (signal) included in this dataset"
      foreign_key:
        table: Channel
        column: Channel_ID

  primary_key: [Dataset_ID, Channel_ID]
