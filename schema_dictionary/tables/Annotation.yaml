_format_version: "1.0"
table:
  name: Annotation
  schema: dbo
  description: >
    Human-authored annotations on time series data. Each annotation
    anchors to a single measurement Stream via a non-NULL Stream_ID FK —
    uniformly covering a sensor Channel or a lab AnalysisSeries (both are
    Stream subtypes) — over a time range. Multiple annotations can overlap
    on the same range. EndTime=NULL means either a point annotation or an
    ongoing situation.
  columns:
    - name: Annotation_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Primary key, auto-incremented"
    - name: Stream_ID
      logical_type: integer
      nullable: false
      description: >
        The measurement stream this annotation attaches to. A single anchor
        for both sensor and lab data: it references any Stream (a sensor
        Channel or a lab AnalysisSeries) with full parity, replacing the
        former Channel_ID / AnalysisSeries_ID XOR arc.
      foreign_key:
        table: Stream
        column: Stream_ID
    - name: AnnotationKind_ID
      logical_type: integer
      nullable: false
      description: "What kind of annotation this is"
      foreign_key:
        table: AnnotationKind
        column: AnnotationKind_ID
    - name: StartTime
      logical_type: timestamp
      precision: 7
      nullable: false
      description: "Start of the annotated time range"
    - name: EndTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "End of the annotated range. NULL = point annotation or ongoing"
    - name: AuthorPerson_ID
      logical_type: integer
      nullable: true
      description: "Person who created this annotation"
      foreign_key:
        table: Person
        column: Person_ID
    - name: Campaign_ID
      logical_type: integer
      nullable: true
      description: "Campaign this annotation is associated with, if any"
      foreign_key:
        table: Campaign
        column: Campaign_ID
    - name: EquipmentEvent_ID
      logical_type: integer
      nullable: true
      description: "Event that caused this annotation, if any (column rename to Event_ID deferred to S3)"
      foreign_key:
        table: Event
        column: Event_ID
    - name: Title
      logical_type: string
      max_length: 200
      nullable: true
      description: "Short title for the annotation"
    - name: Comment
      logical_type: string
      max_length: max
      nullable: true
      description: "Detailed free-text comment"
    - name: CreatedDateTime
      logical_type: timestamp
      precision: 7
      nullable: false
      default: CURRENT_TIMESTAMP
      description: "When this annotation was created"
    - name: ModifiedDateTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "When this annotation was last modified"
    - name: Observation_ID
      logical_type: integer
      nullable: true
      description: >
        Optional link to a specific Observation for point-level annotations
        (e.g., 'wrong focal length on this image'). Valid for either anchor:
        for a sensor annotation it pins one Channel Observation; for a lab
        annotation it pins one Replicate (the Observation backing a single
        AnalysisSeries reading). When NULL, the annotation applies to the time
        range [StartTime, EndTime] on the anchored stream. When set, StartTime
        should match Observation.Timestamp.
      foreign_key:
        table: Observation
        column: Observation_ID
  primary_key: [Annotation_ID]
  indexes:
    - name: IX_Annotation_Stream_Time
      columns: [Stream_ID, StartTime, EndTime]
      unique: false
      description: "Optimizes interval overlap queries for stream-anchored annotations"
    - name: IX_Annotation_Author
      columns: [AuthorPerson_ID, CreatedDateTime]
      unique: false
      description: "Optimizes 'my annotations' and 'recent annotations' queries"
