_format_version: "1.0"
table:
  name: ProcessingLineage
  schema: dbo
  description: >
    Junction table that records the input/output relationships between
    ProcessingStep rows and Channel rows. Each row asserts that a given
    Channel entry was either an Input to, or an Output of, a given
    ProcessingStep. Together these rows form a directed acyclic graph (DAG)
    of data transformations.

    Example: outlier-removal step takes Channel 10 (raw TSS) as Input
    and produces Channel 11 (cleaned TSS) as Output.

  columns:
    - name: ProcessingLineage_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: ProcessingStep_ID
      logical_type: integer
      nullable: false
      description: "The processing step that consumed or produced the Channel entry"
      foreign_key:
        table: ProcessingStep
        column: ProcessingStep_ID

    - name: Channel_ID
      logical_type: integer
      nullable: false
      description: "The Channel entry (time series) that participates in this lineage edge"
      foreign_key:
        table: Channel
        column: Channel_ID
    

    - name: RoleInProcessingStep
      logical_type: string
      max_length: 10
      nullable: false
      description: >
        Whether this Channel entry was an Input (consumed by the step) or
        an Output (produced by the step). CHECK constraint enforces 'Input'
        or 'Output'.

    - name: StartTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: >
        Start of the data slice that was consumed or produced by this step (UTC).
        NULL means the edge applies to the entire channel from the beginning.

    - name: EndTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: >
        End of the data slice that was consumed or produced by this step (UTC).
        NULL means the slice is open-ended (ongoing online processing).

  primary_key: [ProcessingLineage_ID]

  indexes:
    - name: IX_ProcessingLineage_Channel
      columns: [Channel_ID]
      description: "Supports backward lineage queries: given a Channel_ID, find all steps it participated in"

    - name: IX_Lineage_Step_Role
      columns: [ProcessingStep_ID, RoleInProcessingStep]
      description: "Supports forward/backward traversal: given a step, find its inputs or outputs efficiently"
