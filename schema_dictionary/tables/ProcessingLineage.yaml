_format_version: "1.0"
table:
  name: ProcessingLineage
  schema: dbo
  description: >
    Junction table that records the input relationships between ProcessingStep
    rows and Stream rows. Every row is an input edge — it asserts that a given
    Stream (a sensor Channel or a lab AnalysisSeries) was consumed as an input by
    a given ProcessingStep. Together these rows form a directed acyclic graph
    (DAG) of data transformations. Generalizing inputs to Stream is what lets a
    lab AnalysisSeries feed a derived Channel (ADR 0004).

    Output channels are still identified by Channel.ProducedByStep_ID (not stored
    here). The output of a step is always a Channel (a sensor stream); only the
    inputs generalize to any Stream.

    Example: an outlier-removal step consumes Stream 10 (raw TSS) as an input;
    Channel 11 (cleaned TSS) carries ProducedByStep_ID pointing to that step.

  columns:
    - name: ProcessingLineage_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: ProcessingStep_ID
      logical_type: integer
      nullable: false
      description: "The processing step that consumed or produced the Channel entry"
      foreign_key:
        table: ProcessingStep
        column: ProcessingStep_ID

    - name: Stream_ID
      logical_type: integer
      nullable: false
      description: >
        The Stream (a sensor Channel or a lab AnalysisSeries) consumed as an
        input by this ProcessingStep. References any measurement stream, which
        is what allows a lab AnalysisSeries to be an input to a derived Channel
        (ADR 0004).
      foreign_key:
        table: Stream
        column: Stream_ID


    - name: StartTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: >
        Start of the data slice that was consumed or produced by this step (UTC).
        NULL means the edge applies to the entire channel from the beginning.

    - name: EndTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: >
        End of the data slice that was consumed or produced by this step (UTC).
        NULL means the slice is open-ended (ongoing online processing).

  primary_key: [ProcessingLineage_ID]

  indexes:
    - name: IX_ProcessingLineage_Stream
      columns: [Stream_ID]
      description: "Supports backward lineage queries: given a Stream_ID, find all steps it participated in"

    - name: IX_Lineage_Step
      columns: [ProcessingStep_ID]
      description: "Supports forward traversal: given a step, find all its input streams efficiently"
