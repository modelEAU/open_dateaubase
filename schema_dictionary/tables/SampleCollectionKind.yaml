_format_version: "1.0"
table:
  name: SampleCollectionKind
  schema: dbo
  description: >
    Controlled vocabulary describing how a sample was collected.
    Referenced by Sample.SampleCollectionKind_ID.

  columns:
    - name: SampleCollectionKind_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Collection kind name (e.g. 'Grab', 'Composite24h')"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of the collection kind"

  primary_key: [SampleCollectionKind_ID]

  seed_data:
    - { SampleCollectionKind_ID: 1, Name: "Grab",         Description: "Single instantaneous sample collected at one point in time" }
    - { SampleCollectionKind_ID: 2, Name: "Composite24h", Description: "Flow- or time-proportional composite over a 24-hour period" }
    - { SampleCollectionKind_ID: 3, Name: "Composite8h",  Description: "Flow- or time-proportional composite over an 8-hour period" }
    - { SampleCollectionKind_ID: 4, Name: "Passive",      Description: "Passive sampler deployed over an extended exposure period" }
    - { SampleCollectionKind_ID: 5, Name: "Other",        Description: "Collection kind not covered by the standard vocabulary" }
