_format_version: "1.0"
table:
  name: SampleKind
  schema: dbo
  description: >
    Controlled vocabulary describing the nature of a physical sample.
    Referenced by Sample.SampleKind_ID.

  columns:
    - name: SampleKind_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Sample kind name (e.g. 'Field', 'Blank')"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of what this sample kind represents"

  primary_key: [SampleKind_ID]

  seed_data:
    - { SampleKind_ID: 1, Name: "Field",           Description: "Sample collected from a real-world site or process" }
    - { SampleKind_ID: 2, Name: "Synthetic",        Description: "Laboratory-prepared sample with known composition" }
    - { SampleKind_ID: 3, Name: "Master Standard",  Description: "Reference standard used to prepare derived standards" }
    - { SampleKind_ID: 4, Name: "Derived Standard", Description: "Dilution or aliquot derived from a master standard" }
    - { SampleKind_ID: 5, Name: "Blank",            Description: "Blank sample used to detect contamination or baseline" }
