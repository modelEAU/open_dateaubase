_format_version: "1.0"
table:
  name: Campaign
  schema: dbo
  description: "A named collection of measurement activities, classified by type (Experiment, Operations, Commissioning). Campaigns are multi-site: their sites are derived from sampling-location membership (CampaignSamplingLocation to SamplingPoint.Site), not stored. Supersedes Project (defunct table) for all organisational grouping."

  columns:
    - name: Campaign_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key."
    - name: CampaignKind_ID
      logical_type: integer
      nullable: false
      description: "Kind of campaign (See CampaignKind table. E.g., Experiment, Monitoring, Facility Commissioning)."
      foreign_key:
        table: CampaignKind
        column: CampaignKind_ID
    - name: Name
      logical_type: string
      max_length: 200
      nullable: false
      description: "Human-readable name for the campaign."
    - name: Description
      logical_type: string
      max_length: 2000
      nullable: true
      description: "Detailed description of the campaign objectives and scope."
    - name: CampaignStartDateTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "Date and time the campaign began (UTC)."
    - name: CampaignEndDateTime
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "Date and time the campaign ended (UTC); NULL if the campaign is ongoing."
    - name: ResponsiblePerson_ID
      logical_type: integer
      nullable: true
      description: "Person responsible for running the campaign"
      foreign_key:
        table: Person
        column: Person_ID

  primary_key: [Campaign_ID]
