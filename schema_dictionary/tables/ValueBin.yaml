_format_version: "1.0"
table:
  name: ValueBin
  schema: dbo
  description: >
    Individual bins on a ValueBinningAxis. The fields populated on each bin depend on the
    parent axis BinMode: 'interval' bins have LowerBound and UpperBound only;
    'interval_with_nominal' bins have all three fields; 'nominal' bins have NominalValue only.
  columns:
    - name: ValueBin_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"
    - name: ValueBinningAxis_ID
      logical_type: integer
      nullable: false
      description: "References the parent binning axis"
      foreign_key:
        table: ValueBinningAxis
        column: ValueBinningAxis_ID
    - name: BinIndex
      logical_type: integer
      nullable: false
      description: "0-based ordinal position of this bin within its axis"
    - name: LowerBound
      logical_type: float64
      nullable: true
      description: "Inclusive lower edge of this bin in the axis unit; NULL for 'nominal' mode bins"
    - name: UpperBound
      logical_type: float64
      nullable: true
      description: "Exclusive upper edge of this bin in the axis unit; must be greater than LowerBound when set; NULL for 'nominal' mode bins"
    - name: NominalValue
      logical_type: float64
      nullable: true
      description: "Nominal (center or exact) value of this bin in the axis unit; NULL for 'interval' mode bins"
  primary_key: [ValueBin_ID]
  unique_constraints:
    - name: UQ_ValueBin_AxisIndex
      columns: [ValueBinningAxis_ID, BinIndex]
  check_constraints:
    - name: CK_ValueBin_BinValues
      expression: >
        ((LowerBound IS NULL AND UpperBound IS NULL) OR (LowerBound IS NOT NULL AND UpperBound IS NOT NULL))
        AND (LowerBound IS NULL OR UpperBound > LowerBound)
        AND (NominalValue IS NOT NULL OR LowerBound IS NOT NULL)
