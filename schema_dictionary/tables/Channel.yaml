_format_version: "1.0"
table:
  name: Channel
  schema: dbo
  description: >
    Invariant descriptor for a measurement stream (sensor channel).
    Each row identifies a unique (SignalPort, Parameter, DataProvenance, ProcessingDegree)
    combination. A Channel is created once and never changes — equipment swaps and
    sensor relocations are tracked on the SignalPort via SignalPortEquipmentHistory and
    SignalPortLocationHistory, leaving the Channel_ID stable.
    Lab sample results are stored in LabAnalysis + LabValue (not in Channel).

  columns:
    - name: Channel_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: SignalPort_ID
      logical_type: integer
      nullable: false
      description: >
        The SignalPort (stable signal identity) that this measurement stream belongs to.
        Replaces Equipment_ID — equipment that produces data is tracked via
        SignalPortEquipmentHistory, allowing probes to be swapped without breaking the Channel.
      foreign_key:
        table: SignalPort
        column: SignalPort_ID

    - name: Parameter_ID
      logical_type: integer
      nullable: true
      description: "Measured analyte or parameter (e.g. TSS, pH)"
      foreign_key:
        table: Parameter
        column: Parameter_ID

    - name: DataProvenance_ID
      logical_type: integer
      nullable: true
      description: >
        How this data was produced (Sensor=1, Laboratory=2, Manual Entry=3,
        Model Output=4, External Source=5, Forecast=6)
      foreign_key:
        table: DataProvenance
        column: DataProvenance_ID

    - name: ProcessingDegree_ID
      logical_type: integer
      nullable: true
      default: 1
      description: >
        Level of processing applied to this time series (FK to ProcessingDegree lookup).
        Ground truth is the DataLineage graph; this field exists for fast filtering.
        Set once at row creation — if the processing degree changes, a new Channel row is created.
        Default 1 = Raw.
      foreign_key:
        table: ProcessingDegree
        column: ProcessingDegree_ID

    - name: ValueType_ID
      logical_type: integer
      nullable: false
      default: 1
      description: "Shape of stored values (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
      foreign_key:
        table: ValueType
        column: ValueType_ID

  indexes:
    - name: UQ_Channel_SignalStream
      columns: [SignalPort_ID, Parameter_ID, DataProvenance_ID, ProcessingDegree_ID]
      unique: true
      description: >
        Guarantees at most one Channel row per signal stream.
        Filtered: WHERE Parameter_ID IS NOT NULL.
        Enables the self-configuring INSERT-if-not-exists ingestion pattern.

  primary_key: [Channel_ID]
