_format_version: "1.0"
table:
  name: Channel
  schema: dbo
  description: >
    Invariant descriptor for a measurement stream (sensor channel).
    Each row is identified by a unique
    (SignalInterface, TagName, Parameter, DataProvenance, ProcessingDegree)
    combination. A Channel is created once and never changes — equipment
    swaps and sensor relocations are tracked on the physical Equipment via
    EquipmentWiringHistory and EquipmentLocationHistory, leaving Channel_ID
    stable. The specific SignalInterfacePort carrying the stream is
    optional at ingest time and can be backfilled later via
    ChannelPortHistory (and the denormalised SignalInterfacePort_ID below).
    Lab sample results are stored in LabAnalysis + LabValue (not in Channel).

  columns:
    - name: Channel_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: SignalInterface_ID
      logical_type: integer
      nullable: false
      description: >
        The SignalInterface (PLC, SCADA, basestation, ...) that publishes
        this tag. The anchor for ingest: observations are routed by
        (SignalInterface_ID, TagName).
      foreign_key:
        table: SignalInterface
        column: SignalInterface_ID

    - name: TagName
      logical_type: string
      max_length: 200
      nullable: false
      description: >
        Tag string as published by the SignalInterface
        (case-preserved; lookups are case-insensitive trimmed). For
        direct-connect interfaces a synthetic tag such as
        "{equipment_identifier}/{parameter_name}" is auto-generated.

    - name: SignalInterfacePort_ID
      logical_type: integer
      nullable: true
      description: >
        Current physical port (if known) this Channel is gated through.
        Denormalised from the active ChannelPortHistory row for query
        convenience. NULL when the wiring has not yet been traced.
      foreign_key:
        table: SignalInterfacePort
        column: SignalInterfacePort_ID

    - name: ParentChannel_ID
      logical_type: integer
      nullable: true
      description: >
        For sub-signal Channels (Status, Alarm, Uncertainty), points to the
        parent Value Channel. NULL for primary value channels and unlinked
        channels. Self-FK.
      foreign_key:
        table: Channel
        column: Channel_ID

    - name: ChannelRole_ID
      logical_type: integer
      nullable: false
      default: 1
      description: >
        Kind of information this Channel carries (1=Value, 2=Status,
        3=Alarm, 4=Uncertainty). Replaces the former SignalPortType role.
      foreign_key:
        table: ChannelRole
        column: ChannelRole_ID

    - name: Parameter_ID
      logical_type: integer
      nullable: true
      description: "Measured analyte or parameter (e.g. TSS, pH)"
      foreign_key:
        table: Parameter
        column: Parameter_ID

    - name: DataProvenance_ID
      logical_type: integer
      nullable: true
      description: >
        How this data was produced (Sensor=1, Laboratory=2, Manual Entry=3,
        Model Output=4, External Source=5, Forecast=6)
      foreign_key:
        table: DataProvenance
        column: DataProvenance_ID

    - name: ProcessingDegree_ID
      logical_type: integer
      nullable: true
      default: 1
      description: >
        Level of processing applied to this time series (FK to ProcessingDegree lookup).
        Ground truth is the DataLineage graph; this field exists for fast filtering.
        Set once at row creation — if the processing degree changes, a new Channel row is created.
        Default 1 = Raw.
      foreign_key:
        table: ProcessingDegree
        column: ProcessingDegree_ID

    - name: ValueType_ID
      logical_type: integer
      nullable: false
      default: 1
      description: "Shape of stored values (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
      foreign_key:
        table: ValueType
        column: ValueType_ID

    - name: Unit_ID
      logical_type: integer
      nullable: true
      description: >
        Unit of measurement for values stored in this channel (e.g. mg/L, NTU).
        Set at channel creation via the ingestion pipeline and treated as immutable
        thereafter — a unit change requires a new Channel row.
      foreign_key:
        table: Unit
        column: Unit_ID

  indexes:
    - name: UQ_Channel_SignalStream
      columns: [SignalInterface_ID, TagName, Parameter_ID, DataProvenance_ID, ProcessingDegree_ID]
      unique: true
      description: >
        Guarantees at most one Channel row per signal stream.
        Filtered: WHERE Parameter_ID IS NOT NULL.
        Enables the self-configuring INSERT-if-not-exists ingestion pattern.
    - name: IX_Channel_ParentChannel
      columns: [ParentChannel_ID]
      unique: false
      description: "Supports sub-signal lookups (Status/Alarm/Uncertainty for a given value channel)"

  primary_key: [Channel_ID]
