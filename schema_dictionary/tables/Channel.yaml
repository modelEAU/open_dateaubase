_format_version: "1.0"
table:
  name: Channel
  schema: dbo
  description: >
    Invariant descriptor for a measurement stream (sensor channel).
    Each row identifies a unique (Equipment, Parameter, DataProvenance, ProcessingDegree)
    combination. Context that varies over time (location, campaign) is derived at
    query time via EquipmentInstallation and CampaignEquipment joins — it is NOT stored here.
    Lab measurements are stored in Value (scalar) or ValueVector/ValueMatrix/ValueImage.
    Lab sample results are stored in LabAnalysis + LabValue (not in Channel).

  columns:
    - name: Channel_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: Equipment_ID
      logical_type: integer
      nullable: true
      description: "Physical instrument that produces this measurement stream."
      foreign_key:
        table: Equipment
        column: Equipment_ID

    - name: Parameter_ID
      logical_type: integer
      nullable: true
      description: "Measured analyte or parameter (e.g. TSS, pH)"
      foreign_key:
        table: Parameter
        column: Parameter_ID

    - name: DataProvenance_ID
      logical_type: integer
      nullable: true
      description: "How this data was produced (Sensor=1, Laboratory=2, Manual Entry=3, Model Output=4, External Source=5)"
      foreign_key:
        table: DataProvenance
        column: DataProvenance_ID

    - name: ProcessingDegree_ID
      logical_type: integer
      nullable: true
      default: 1
      description: >
        Level of processing applied to this time series (FK to ProcessingDegree lookup).
        Ground truth is the DataLineage graph; this field exists for fast filtering.
        Set once at row creation — if the processing degree changes, a new Channel row is created.
        Default 1 = Raw.
      foreign_key:
        table: ProcessingDegree
        column: ProcessingDegree_ID

    - name: ValueType_ID
      logical_type: integer
      nullable: false
      default: 1
      description: "Shape of stored values (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
      foreign_key:
        table: ValueType
        column: ValueType_ID

    - name: StatusChannel_ID
      logical_type: integer
      nullable: true
      description: >
        If this Channel is a per-measurement-channel status time series, this points to
        the measurement Channel_ID it describes. NULL for measurement channels and
        device-level status channels.
      foreign_key:
        table: Channel
        column: Channel_ID

  indexes:
    - name: UQ_Channel_SensorStream
      columns: [Equipment_ID, Parameter_ID, DataProvenance_ID, ProcessingDegree_ID]
      unique: true
      description: >
        Guarantees at most one Channel row per sensor stream.
        Filtered: WHERE Equipment_ID IS NOT NULL.
        Enables the self-configuring INSERT-if-not-exists ingestion pattern.

  primary_key: [Channel_ID]
