_format_version: "1.0"
table:
  name: Channel
  schema: dbo
  description: >
    Invariant descriptor for a measurement stream (sensor channel).
    Channel is the sensor subtype of Stream (table-per-type inheritance):
    it shares Stream_ID as its own primary key, which is simultaneously a
    foreign key to Stream.Stream_ID. Each row is identified by a unique
    (SignalInterface, TagName, Parameter, DataProvenance, ProducedByStep)
    combination. A Channel is created once and never changes — equipment
    swaps and sensor relocations are tracked on the physical Equipment via
    EquipmentWiringHistory and EquipmentLocationHistory, leaving Stream_ID
    stable. The specific SignalInterfacePort carrying the stream is
    optional at ingest time and is recorded over time in ChannelPortHistory
    (the active row is the current port). Queries that need the current port
    resolve it through the vw_ChannelResolved view, so there is a single
    source of truth and no denormalised column to drift.
    Lab sample results are stored in LabAnalysis + LabValue (not in Channel).

    Raw/ingested channels have SignalInterface_ID NOT NULL and ProducedByStep_ID NULL.
    Derived/processed channels have SignalInterface_ID NULL and ProducedByStep_ID pointing
    to the ProcessingStep that produced them. Accumulated processing operations applied to
    a Channel live in the ChannelTrait junction (to be added in a later slice).

  columns:
    - name: Stream_ID
      logical_type: integer
      nullable: false
      identity: false
      description: >
        Shared primary key (table-per-type inheritance): both the primary
        key of Channel and a foreign key to Stream.Stream_ID. Every Channel
        owns exactly one Stream row carrying this same identifier.
      foreign_key:
        table: Stream
        column: Stream_ID

    - name: SignalInterface_ID
      logical_type: integer
      nullable: true
      description: >
        The SignalInterface (PLC, SCADA, basestation, ...) that publishes
        this tag. The anchor for ingest: observations are routed by
        (SignalInterface_ID, TagName). NULL for derived/processed channels
        that have no physical source interface.
      foreign_key:
        table: SignalInterface
        column: SignalInterface_ID

    - name: TagName
      logical_type: string
      max_length: 200
      nullable: false
      description: >
        Tag string as published by the SignalInterface
        (case-preserved; lookups are case-insensitive trimmed). For
        direct-connect interfaces a synthetic tag such as
        "{equipment_identifier}/{parameter_name}" is auto-generated.

    - name: ParentChannel_ID
      logical_type: integer
      nullable: true
      description: >
        For sub-signal Channels (Status, Alarm, Uncertainty), points to the
        parent value Channel's Stream_ID. NULL for primary value channels and
        unlinked channels. Self-FK.
      foreign_key:
        table: Channel
        column: Stream_ID

    - name: ChannelKind_ID
      logical_type: integer
      nullable: false
      default: 1
      description: >
        Kind of information this Channel carries (1=Value, 2=Status,
        3=Alarm, 4=Uncertainty).
      foreign_key:
        table: ChannelKind
        column: ChannelKind_ID

    - name: Parameter_ID
      logical_type: integer
      nullable: true
      description: "Measured analyte or parameter (e.g. TSS concetration, pH)"
      foreign_key:
        table: Parameter
        column: Parameter_ID

    - name: DataProvenanceKind_ID
      logical_type: integer
      nullable: true
      description: >
        How this data was produced (Sensor=1, Laboratory=2, Manual Entry=3,
        Model Output=4, External Source=5, Forecast=6)
      foreign_key:
        table: DataProvenanceKind
        column: DataProvenanceKind_ID

    - name: ProducedByStep_ID
      logical_type: integer
      nullable: true
      description: >
        The ProcessingStep that produced this channel. NULL for raw/ingested channels.
        Distinguishes independently-processed variants of the same physical signal stream:
        two users running the same algorithm on the same raw channel each create a separate
        ProcessingStep row and therefore separate Channel rows.
      foreign_key:
        table: ProcessingStep
        column: ProcessingStep_ID

    - name: ValueKind_ID
      logical_type: integer
      nullable: false
      default: 1
      description: "Shape of stored values (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
      foreign_key:
        table: ValueKind
        column: ValueKind_ID

    - name: Unit_ID
      logical_type: integer
      nullable: true
      description: >
        Unit of measurement for values stored in this channel (e.g. mg/L, NTU).
        Set at channel creation via the ingestion pipeline and treated as immutable
        thereafter — a unit change requires a new Channel row.
      foreign_key:
        table: Unit
        column: Unit_ID

  indexes:
    - name: UQ_Channel_SignalStream
      columns: [SignalInterface_ID, TagName, Parameter_ID, DataProvenanceKind_ID, ProducedByStep_ID]
      unique: true
      description: >
        Guarantees at most one Channel row per signal stream identity.
        ProducedByStep_ID is NULL for raw/ingested channels (one raw channel per
        physical signal stream) and non-NULL for processed variants (each independent
        processing run produces a distinct Channel row). Processing kind is not part
        of the identity — it is always derivable via ProducedByStep_ID → ProcessingStep.
        Filtered: WHERE Parameter_ID IS NOT NULL.
        Enables the self-configuring INSERT-if-not-exists ingestion pattern.
    - name: IX_Channel_ParentChannel
      columns: [ParentChannel_ID]
      unique: false
      description: "Supports sub-signal lookups (Status/Alarm/Uncertainty for a given value channel)"

  primary_key: [Stream_ID]
