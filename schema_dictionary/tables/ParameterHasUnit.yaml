_format_version: "1.0"
table:
  name: ParameterHasUnit
  schema: dbo
  description: >
    Records which Units are valid for the measurement values of each Parameter.
    Covers Scalar, Vector, and Matrix parameters. Image parameters are excluded.
    For Vector/Matrix parameters this is the unit of the individual scalar values
    at each bin — axis units live in ValueBinningAxis.Unit_ID, not here.
    Do not hand-edit seed_data — rows are generated by generate_from_yaml.py
    by merging QUDT applicableUnit results with per-parameter manual_units overrides.

  columns:
    - name: Parameter_ID
      logical_type: integer
      nullable: false
      description: "Link to Parameter"
      foreign_key: { table: Parameter, column: Parameter_ID }
    - name: Unit_ID
      logical_type: integer
      nullable: false
      description: "Link to Unit"
      foreign_key: { table: Unit, column: Unit_ID }

  primary_key: [Parameter_ID, Unit_ID]
