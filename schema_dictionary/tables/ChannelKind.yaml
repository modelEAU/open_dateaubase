_format_version: "1.0"
table:
  name: ChannelKind
  schema: dbo
  description: >
    Controlled vocabulary describing what kind of information a Channel
    carries (Value / Status / Alarm / Uncertainty).
    Sub-signals (Status, Alarm, Uncertainty) attach to their parent value
    Channel via Channel.ParentChannel_ID.

  columns:
    - name: ChannelKind_ID
      logical_type: integer
      nullable: false
      description: "Surrogate primary key, manually assigned"

    - name: Name
      logical_type: string
      max_length: 50
      nullable: false
      description: "Short name for this channel kind"

    - name: Description
      logical_type: string
      max_length: 200
      nullable: true
      description: "Explanation of what this channel kind means"

  primary_key: [ChannelKind_ID]

  seed_data:
    - { ChannelKind_ID: 1, Name: "Value",       Description: "Primary measurement or output value" }
    - { ChannelKind_ID: 2, Name: "Status",      Description: "Device or measurement status flag" }
    - { ChannelKind_ID: 3, Name: "Alarm",       Description: "Alarm or alert indicator" }
    - { ChannelKind_ID: 4, Name: "Uncertainty", Description: "Measurement uncertainty estimate" }
