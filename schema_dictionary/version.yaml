schema_version: "2.2.0"
description: >
  Adds SampleMaterialKind controlled vocabulary describing a sample's physical
  matrix (grit, wastewater, mixed liquor, sludges, membrane and reference
  waters), orthogonal to SampleKind's analytical role. Sample gains a nullable
  SampleMaterialKind_ID FK; LabPanel gains DefaultSampleKind_ID and
  DefaultSampleMaterialKind_ID so panels can pre-fill both role and matrix.
  See migrations/v2.1.0_to_v2.2.0_mssql.sql.
date: "2026-07-07"
