schema_version: "2.6.0"
description: >
  Process unit vocabulary rebuilt on the device and stage axes: ProcessUnitKind
  gains a Category (Structural / Treatment / Conveyance) and the named treatment
  nouns it lacked, TreatmentStage arrives as its own vocabulary referenced by
  ProcessUnit so a clarifier is primary or secondary by role rather than by kind.
  Also splits OperationKind's Interpolation from Reconstruction, and adds
  Person.IsActive.
