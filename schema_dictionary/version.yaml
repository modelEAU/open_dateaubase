schema_version: "2.6.0"
description: >
  ControlLoopPort now references Stream (any time-series identity — a sensor
  Channel or a lab AnalysisSeries) instead of Channel: column Channel_ID →
  Stream_ID with FK to Stream, and unique index renamed to
  UQ_ControlLoopPort_LoopStream. A control loop can now wire lab streams, not
  just sensor channels. Pre-release, fresh install only — no migration.
date: "2026-07-03"
