schema_version: "2.3.0"
description: >
  Retires the six cause-named AnnotationKinds (Fault, Maintenance, Calibration
  Period, Experiment, Process Event, Equipment Relocation), leaving five verdicts
  about the data: Anomaly, Data Quality, Note, Exclusion, Confirmed. Causes belong
  in EventKind; an annotation names what is wrong with the data, never why. See
  ADR-0007 and migrations/v2.2.0_to_v2.3.0_mssql.sql, which remaps existing rows
  onto a survivor before deleting the retired kinds.
date: "2026-07-14"
