description: >
  PRD 7 slice 1. Sample gains a field Replicate (INT NOT NULL DEFAULT 1, distinct
  from the analytical LabAnalysis.Replicate) and UQ_Sample_Identity over
  (SamplingPoint_ID, SampleDateTimeStart, SampleKind_ID, Replicate,
  ParentSample_ID), so re-imports are rejected while aliquots, blanks, standards
  and genuine field replicates stay legal. AnalysisSeries gains a nullable
  Laboratory_ID which joins UQ_AnalysisSeries_Identity, so two laboratories
  measuring one parameter become two series.
