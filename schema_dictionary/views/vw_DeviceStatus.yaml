_format_version: "1.0"
view:
  name: vw_DeviceStatus
  schema: dbo
  description: >
    Device-level status view. Finds status channels through the v4.0.0
    SignalInterface + EquipmentWiringHistory chain: a status Channel
    (ChannelRole = Status) inherits its equipment from the parent value
    Channel's current wiring. Replaces the port-centric v3.0.0 join.
  columns:
    - name: StatusChannelID
      sql_data_type: INT
      description: "Stream_ID of the status time series (Channel PK is now Stream_ID)"
    - name: EquipmentID
      sql_data_type: INT
      description: "Equipment ID this status describes"
    - name: EquipmentName
      sql_data_type: NVARCHAR(200)
      description: "Identifier of the equipment"
    - name: Timestamp
      sql_data_type: DATETIME2(7)
      description: "Timestamp of the status observation"
    - name: StatusCodeID
      sql_data_type: INT
      description: "Raw integer status code stored in the status Channel's Value rows"
  view_definition: |
    SELECT
        statusC.[Stream_ID]        AS StatusChannelID,
        e.[Equipment_ID]           AS EquipmentID,
        e.[Identifier]             AS EquipmentName,
        o.[Timestamp],
        CAST(v.[Value] AS INT)     AS StatusCodeID
    FROM [dbo].[Value] v
    JOIN [dbo].[Observation]  o       ON o.[Observation_ID]   = v.[Observation_ID]
    JOIN [dbo].[Channel]      statusC ON statusC.[Stream_ID]  = o.[Channel_ID]
    JOIN [dbo].[ChannelKind]  role    ON role.[ChannelKind_ID] = statusC.[ChannelKind_ID]
    JOIN [dbo].[vw_ChannelResolved] valueC ON valueC.[Stream_ID] = statusC.[ParentChannel_ID]
    JOIN [dbo].[EquipmentWiringHistory] ewh
           ON ewh.[SignalInterface_ID] = valueC.[SignalInterface_ID]
          AND (
               ewh.[SignalInterfacePort_ID] = valueC.[SignalInterfacePort_ID]
               OR valueC.[SignalInterfacePort_ID] IS NULL
              )
          AND ewh.[ValidTo] IS NULL
    JOIN [dbo].[Equipment]    e       ON e.[Equipment_ID]     = ewh.[Equipment_ID]
    WHERE role.[Name] = N'Status'
