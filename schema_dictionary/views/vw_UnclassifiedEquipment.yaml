_format_version: "1.0"
view:
  name: vw_UnclassifiedEquipment
  schema: dbo
  description: >
    Health view: equipment that cannot be classified, either because it has no
    EquipmentModel or because its model has no EquipmentKind. Pickers that scope
    themselves to a kind — the laboratory forms only offer Samplers — silently
    drop these rows, so "my sampler isn't in the dropdown" is diagnosed here.
    The Reason column separates the two defects, since they are fixed in
    different places: attach a model to the equipment, or set the kind on the
    model. Inactive equipment is included, because the equipment lookup does not
    filter on IsActive either — any row it can return is a row that can go
    missing from a picker. Models with no equipment at all are out of scope:
    they cannot break a picker, and the EquipmentModel form already exposes the
    kind.
  columns:
    - name: EquipmentID
      sql_data_type: INT
      description: "Equipment that no picker can classify"
    - name: Identifier
      sql_data_type: NVARCHAR(100)
      description: "The equipment's identifier"
    - name: IsActive
      sql_data_type: BIT
      description: "Whether the equipment is active"
    - name: EquipmentModelID
      sql_data_type: INT
      description: "The equipment's model, NULL when none is attached"
    - name: EquipmentModelName
      sql_data_type: NVARCHAR(100)
      description: "Name of the equipment's model, NULL when none is attached"
    - name: Reason
      sql_data_type: NVARCHAR(20)
      description: "Which defect applies: 'no model' or 'model has no kind'"
  view_definition: |
    SELECT
        e.[Equipment_ID]       AS EquipmentID,
        e.[Identifier]         AS Identifier,
        e.[IsActive]           AS IsActive,
        e.[EquipmentModel_ID]  AS EquipmentModelID,
        m.[EquipmentModel]     AS EquipmentModelName,
        CASE WHEN e.[EquipmentModel_ID] IS NULL
             THEN N'no model' ELSE N'model has no kind' END AS Reason
    FROM [dbo].[Equipment] e
    LEFT JOIN [dbo].[EquipmentModel] m ON m.[EquipmentModel_ID] = e.[EquipmentModel_ID]
    WHERE e.[EquipmentModel_ID] IS NULL OR m.[EquipmentKind_ID] IS NULL
