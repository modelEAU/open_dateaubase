_format_version: "1.0"
view:
  name: vw_ChannelStatus
  schema: dbo
  description: >
    Per-channel sensor status view. A status channel is a Channel whose
    ChannelRole = Status and whose ParentChannel_ID points at the measured
    value Channel. The equipment behind the value channel is resolved via
    the new EquipmentWiringHistory table (v4.0.0).
  columns:
    - name: StatusChannelID
      sql_data_type: INT
      description: "Channel_ID of the status time series"
    - name: MeasurementChannelID
      sql_data_type: INT
      description: "Channel_ID of the measurement channel this status describes"
    - name: EquipmentID
      sql_data_type: INT
      description: "Equipment ID currently wired to the measurement channel (NULL if unresolved)"
    - name: EquipmentName
      sql_data_type: NVARCHAR(200)
      description: "Identifier of the currently-linked equipment"
    - name: MeasurementParameter
      sql_data_type: NVARCHAR(100)
      description: "Name of the measured parameter (TSS, pH, etc.)"
    - name: Timestamp
      sql_data_type: DATETIME2(7)
      description: "Timestamp of the status observation"
    - name: StatusCodeID
      sql_data_type: INT
      description: "Raw integer status code stored in the status Channel's Value rows"
  view_definition: |
    SELECT
        statusC.[Channel_ID]      AS StatusChannelID,
        valueC.[Channel_ID]       AS MeasurementChannelID,
        e.[Equipment_ID]          AS EquipmentID,
        e.[Identifier]            AS EquipmentName,
        p.[Parameter]             AS MeasurementParameter,
        o.[Timestamp],
        CAST(v.[Value] AS INT)    AS StatusCodeID
    FROM [dbo].[Value] v
    JOIN [dbo].[Observation]   o       ON o.[Observation_ID]   = v.[Observation_ID]
    JOIN [dbo].[Channel]       statusC ON statusC.[Channel_ID] = o.[Channel_ID]
    JOIN [dbo].[ChannelRole]   role    ON role.[ChannelRole_ID] = statusC.[ChannelRole_ID]
    JOIN [dbo].[Channel]       valueC  ON valueC.[Channel_ID]   = statusC.[ParentChannel_ID]
    JOIN [dbo].[Parameter]     p       ON p.[Parameter_ID]     = valueC.[Parameter_ID]
    LEFT JOIN [dbo].[EquipmentWiringHistory] ewh
           ON ewh.[SignalInterface_ID] = valueC.[SignalInterface_ID]
          AND (
               ewh.[SignalInterfacePort_ID] = valueC.[SignalInterfacePort_ID]
               OR valueC.[SignalInterfacePort_ID] IS NULL
              )
          AND ewh.[ValidTo] IS NULL
    LEFT JOIN [dbo].[Equipment] e ON e.[Equipment_ID] = ewh.[Equipment_ID]
    WHERE role.[Name] = N'Status'
      AND statusC.[ParentChannel_ID] IS NOT NULL
