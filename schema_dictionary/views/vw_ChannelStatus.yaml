_format_version: "1.0"
view:
  name: vw_ChannelStatus
  schema: dbo
  description: "Join view for per-channel sensor status queries. Selects all Channel rows where StatusChannel_ID is non-NULL, joining each status time series back to its measurement Channel."
  columns:
    - name: StatusChannelID
      sql_data_type: INT
      description: "Channel_ID of the status time series"
    - name: MeasurementChannelID
      sql_data_type: INT
      description: "Channel_ID of the measurement channel this status describes"
    - name: EquipmentID
      sql_data_type: INT
      description: "Equipment ID of the sensor"
    - name: EquipmentName
      sql_data_type: NVARCHAR(100)
      description: "Name/identifier of the equipment"
    - name: MeasurementParameter
      sql_data_type: NVARCHAR(100)
      description: "Name of the measured parameter (TSS, pH, etc.)"
    - name: Timestamp
      sql_data_type: DATETIME2(7)
      description: "Timestamp of the status transition"
    - name: StatusCodeID
      sql_data_type: INT
      description: "Status code from SensorStatusCode"
    - name: StatusName
      sql_data_type: NVARCHAR(100)
      description: "Human-readable status name"
    - name: IsOperational
      sql_data_type: BIT
      description: "Whether data is trustworthy in this status"
    - name: Severity
      sql_data_type: INT
      description: "Urgency level (0=normal, 1=warning, 2=fault, 3=critical)"
  view_definition: |
    SELECT
        statusC.[Channel_ID]          AS StatusChannelID,
        statusC.[StatusChannel_ID]    AS MeasurementChannelID,
        measC.[Equipment_ID]          AS EquipmentID,
        e.[identifier]                AS EquipmentName,
        p.[Parameter]                 AS MeasurementParameter,
        v.[Timestamp],
        CAST(v.[Value] AS INT)        AS StatusCodeID,
        sc.[StatusName],
        sc.[IsOperational],
        sc.[Severity]
    FROM [dbo].[Value] v
    JOIN [dbo].[Channel]               statusC ON statusC.[Channel_ID]      = v.[Channel_ID]
    JOIN [dbo].[Channel]               measC   ON measC.[Channel_ID]        = statusC.[StatusChannel_ID]
    JOIN [dbo].[Parameter]             p       ON p.[Parameter_ID]          = measC.[Parameter_ID]
    JOIN [dbo].[Equipment]             e       ON e.[Equipment_ID]          = measC.[Equipment_ID]
    LEFT JOIN [dbo].[SensorStatusCode] sc      ON sc.[StatusCodeID]         = CAST(v.[Value] AS INT)
    WHERE statusC.[StatusChannel_ID] IS NOT NULL
