_format_version: "1.0"
view:
  name: vw_DeploymentCoherence
  schema: dbo
  description: >
    Surfaces deployment drift (consistency audit F1): equipment whose active
    location sits at a Site different from the Site where its connected Data
    Acquisition System is currently deployed. A DAS is deployed to a Site
    (DASLocationHistory); equipment is wired to that DAS's SignalInterfaces
    (EquipmentWiringHistory) and physically placed at a SamplingPoint
    (EquipmentLocationHistory), and every SamplingPoint belongs to a Site. When
    a DAS is moved to a new Site, the equipment it feeds does not move with it
    automatically — this view lists each such stranded equipment so the drift
    can be corrected (relocate the equipment, or move the DAS back). Only active
    rows (ValidTo IS NULL) on both histories are considered; a row appears here
    only while the mismatch is live.
  columns:
    - name: DAS_ID
      sql_data_type: INT
      description: "The deployed Data Acquisition System"
    - name: DASName
      sql_data_type: NVARCHAR(200)
      description: "DAS name"
    - name: DASSite_ID
      sql_data_type: INT
      description: "Site the DAS is currently deployed to"
    - name: DASSiteName
      sql_data_type: NVARCHAR(200)
      description: "Name of the DAS's Site"
    - name: Equipment_ID
      sql_data_type: INT
      description: "Equipment wired to the DAS but located elsewhere"
    - name: EquipmentName
      sql_data_type: NVARCHAR(200)
      description: "Equipment identifier"
    - name: EquipmentSite_ID
      sql_data_type: INT
      description: "Site of the equipment's current SamplingPoint (the drift)"
    - name: EquipmentSiteName
      sql_data_type: NVARCHAR(200)
      description: "Name of the equipment's current Site"
    - name: SamplingPoint_ID
      sql_data_type: INT
      description: "Equipment's current SamplingPoint"
    - name: SamplingPointName
      sql_data_type: NVARCHAR(200)
      description: "Name of the equipment's current SamplingPoint"
  view_definition: |
    SELECT
        dlh.[DataAcquisitionSystem_ID]      AS DAS_ID,
        das.[Name]                          AS DASName,
        dlh.[Site_ID]                       AS DASSite_ID,
        dsite.[Name]                        AS DASSiteName,
        e.[Equipment_ID]                    AS Equipment_ID,
        e.[Identifier]                      AS EquipmentName,
        sp.[Site_ID]                        AS EquipmentSite_ID,
        esite.[Name]                        AS EquipmentSiteName,
        sp.[SamplingPoint_ID]               AS SamplingPoint_ID,
        sp.[SamplingPoint]                  AS SamplingPointName
    FROM [dbo].[DASLocationHistory] dlh
    JOIN [dbo].[DataAcquisitionSystem] das ON das.[DataAcquisitionSystem_ID] = dlh.[DataAcquisitionSystem_ID]
    JOIN [dbo].[SignalInterface] si        ON si.[DataAcquisitionSystem_ID] = dlh.[DataAcquisitionSystem_ID]
    JOIN [dbo].[EquipmentWiringHistory] ewh ON ewh.[SignalInterface_ID] = si.[SignalInterface_ID]
                                           AND ewh.[ValidTo] IS NULL
    JOIN [dbo].[Equipment] e               ON e.[Equipment_ID] = ewh.[Equipment_ID]
    JOIN [dbo].[EquipmentLocationHistory] elh ON elh.[Equipment_ID] = e.[Equipment_ID]
                                           AND elh.[ValidTo] IS NULL
    JOIN [dbo].[SamplingPoint] sp          ON sp.[SamplingPoint_ID] = elh.[SamplingPoint_ID]
    LEFT JOIN [dbo].[Site] dsite           ON dsite.[Site_ID] = dlh.[Site_ID]
    LEFT JOIN [dbo].[Site] esite           ON esite.[Site_ID] = sp.[Site_ID]
    WHERE dlh.[ValidTo] IS NULL
      AND sp.[Site_ID] <> dlh.[Site_ID]
