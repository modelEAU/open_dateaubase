_format_version: "1.0"
table:
  name: MetaData
  schema: dbo
  description: >
    Invariant descriptor for a measurement stream (sensor channel or lab series).
    Each row identifies a unique (Equipment, Parameter, Unit, DataProvenance, ProcessingDegree)
    combination. Context that varies over time (location, campaign, project) is derived at
    query time via EquipmentInstallation joins — it is NOT stored here.
    Lab-specific context (Sample, Laboratory, Analyst) is kept until Phase B when a
    dedicated LabAnalysis table will replace it.

  columns:
    - name: Metadata_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"

    - name: Equipment_ID
      logical_type: integer
      nullable: true
      description: "Physical instrument that produces this measurement stream. NULL for lab data."
      foreign_key:
        table: Equipment
        column: Equipment_ID

    - name: Parameter_ID
      logical_type: integer
      nullable: true
      description: "Measured analyte or parameter (e.g. TSS, pH)"
      foreign_key:
        table: Parameter
        column: Parameter_ID

    - name: Unit_ID
      logical_type: integer
      nullable: true
      description: "Measurement unit (e.g. mg/L)"
      foreign_key:
        table: Unit
        column: Unit_ID

    - name: DataProvenance_ID
      logical_type: integer
      nullable: true
      description: "How this data was produced (Sensor=1, Laboratory=2, Manual Entry=3, Model Output=4, External Source=5)"
      foreign_key:
        table: DataProvenance
        column: DataProvenance_ID

    - name: ProcessingDegree
      logical_type: string
      max_length: 50
      nullable: true
      default: "Raw"
      description: >
        Level of processing applied to this time series.
        Ground truth is the DataLineage graph; this field exists for fast filtering.
        Set once at row creation — if the processing degree changes, a new MetaData row is created.
        Controlled vocabulary: Raw, Cleaned, Calibrated, Validated, Filtered, Predicted.
      value_set: processing_degree_set

    - name: ValueType_ID
      logical_type: integer
      nullable: false
      default: 1
      description: "Shape of stored values (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
      foreign_key:
        table: ValueType
        column: ValueType_ID

    - name: Procedure_ID
      logical_type: integer
      nullable: true
      description: "Standard operating procedure used. Phase B: migrated to LabAnalysis."
      foreign_key:
        table: Procedures
        column: Procedure_ID

    - name: Sample_ID
      logical_type: integer
      nullable: true
      description: "Discrete sample analysed (lab data only, DataProvenance_ID=2). Phase B: migrated to LabAnalysis."
      foreign_key:
        table: Sample
        column: Sample_ID

    - name: Laboratory_ID
      logical_type: integer
      nullable: true
      description: "Laboratory where analysis was performed (lab data only). Phase B: migrated to LabAnalysis."
      foreign_key:
        table: Laboratory
        column: Laboratory_ID

    - name: AnalystPerson_ID
      logical_type: integer
      nullable: true
      description: "Person who performed the analysis (lab data only). Phase B: migrated to LabAnalysis."
      foreign_key:
        table: Person
        column: Person_ID

    - name: StatusOfMetaDataID
      logical_type: integer
      nullable: true
      description: >
        If this MetaData entry is a status time series, this points to the measurement
        MetaData entry it describes. NULL for measurement entries and non-status entries.
      foreign_key:
        table: MetaData
        column: Metadata_ID

    - name: StatusOfEquipmentID
      logical_type: integer
      nullable: true
      description: >
        If this MetaData entry is a device-level status time series, this points to the
        Equipment it describes. NULL for channel-level status and non-status entries.
      foreign_key:
        table: Equipment
        column: Equipment_ID

  check_constraints:
    - name: CK_MetaData_StatusTarget
      expression: "NOT (StatusOfMetaDataID IS NOT NULL AND StatusOfEquipmentID IS NOT NULL)"
      description: >
        A status entry describes either a measurement channel OR a device, never both.
        At most one of StatusOfMetaDataID and StatusOfEquipmentID can be non-NULL.

  indexes:
    - name: UQ_MetaData_SensorStream
      columns: [Equipment_ID, Parameter_ID, DataProvenance_ID, ProcessingDegree]
      unique: true
      description: >
        Guarantees at most one MetaData row per sensor stream.
        Filtered: WHERE Equipment_ID IS NOT NULL AND Sample_ID IS NULL.
        Enables the self-configuring INSERT-if-not-exists ingestion pattern.

  primary_key: [Metadata_ID]
