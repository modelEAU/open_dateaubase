_format_version: "1.0"
table:
  name: EquipmentEvent
  schema: dbo
  description: "Records a discrete lifecycle event (calibration, maintenance, failure, etc.) that occurred on a specific piece of equipment."

  columns:
    - name: EquipmentEvent_ID
      logical_type: integer
      nullable: false
      identity: true
      description: "Surrogate primary key"
    - name: Equipment_ID
      logical_type: integer
      nullable: false
      description: "Equipment on which the event occurred"
      foreign_key:
        table: Equipment
        column: Equipment_ID
    - name: EquipmentEventKind_ID
      logical_type: integer
      nullable: false
      description: "Kind of lifecycle event"
      foreign_key:
        table: EquipmentEventKind
        column: EquipmentEventKind_ID
    - name: EventDateTimeStart
      logical_type: timestamp
      precision: 7
      nullable: false
      description: "Date and time the event began (UTC)"
    - name: IsInstantaneous
      logical_type: boolean
      nullable: false
      default: false
      description: "True if the event occurred at a single point in time. When true, EventDateTimeEnd must be NULL. When false and EventDateTimeEnd is NULL, the event is ongoing."
    - name: EventDateTimeEnd
      logical_type: timestamp
      precision: 7
      nullable: true
      description: "Date and time the event ended (UTC). NULL when IsInstantaneous=1 (point-in-time) or when the event is still ongoing (IsInstantaneous=0)."
    - name: PerformedByPerson_ID
      logical_type: integer
      nullable: true
      description: "Person who physically performed the event (e.g. technician on site)"
      foreign_key:
        table: Person
        column: Person_ID
    - name: RecordedByPerson_ID
      logical_type: integer
      nullable: true
      description: "Person who entered this record into the system (may differ from PerformedByPerson_ID)"
      foreign_key:
        table: Person
        column: Person_ID
    - name: Notes
      logical_type: string
      max_length: max
      nullable: true
      description: "Free-text notes about the event"

  primary_key: [EquipmentEvent_ID]

  indexes:
    - name: IX_EquipmentEvent_Equipment_Start
      columns: [Equipment_ID, EventDateTimeStart]
      unique: false
      description: "Supports efficient retrieval of event history for a specific sensor ordered by time"
