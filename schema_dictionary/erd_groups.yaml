# ERD Thematic Group Configuration
# Table names must match PascalCase YAML filenames in schema_dictionary/tables/
# Tables not listed here are placed in the 'Uncategorized' group.
# Every controlled-vocabulary "*Kind" table is grouped with its domain so each
# theme reads as a self-contained slice; purely cross-cutting lookups live in
# the Reference group, and infrastructure tables in System & Audit.

groups:
  site_facility:
    name: Site & Facility
    color: "#2563eb"
    tables:
      - Site
      - SiteKind
      - SamplingPoint
      - ProcessUnit
      - ProcessUnitKind
      - Watershed
      - HydrologicalCharacteristics
      - LandUse

  equipment:
    name: Field System & Equipment
    color: "#059669"
    tables:
      - DataAcquisitionSystem
      - DataAcquisitionSystemKind
      - DASLocationHistory
      - SignalInterface
      - SignalInterfacePort
      - Equipment
      - EquipmentModel
      - EquipmentModelHasParameter
      - EquipmentModelHasProcedures
      - EquipmentEvent
      - EquipmentEventKind
      - EquipmentLocationHistory
      - EquipmentWiringHistory

  signal_channel:
    name: Streams & Channels
    color: "#7c3aed"
    tables:
      - Stream
      - StreamKind
      - Channel
      - ChannelKind
      - ChannelAxis
      - ChannelTrait
      - ChannelPortHistory
      - AnalysisSeries
      - AnalysisSeriesAxis
      - Dataset
      - DatasetChannel

  observations:
    name: Observations & Values
    color: "#dc2626"
    tables:
      - Observation
      - Value
      - ValueVector
      - ValueMatrix
      - ValueImage
      - ValueBin
      - ValueBinningAxis
      - ValueKind
      - BinKind

  lab:
    name: Lab
    color: "#0891b2"
    tables:
      - Laboratory
      - LabExperiment
      - LabAnalysis
      - LabPanel
      - LabPanelSeries
      - Sample
      - SampleKind
      - SampleMaterialKind
      - SampleCollectionKind
      - ReviewStatus

  campaign_provenance:
    name: Campaigns & Provenance
    color: "#ea580c"
    tables:
      - Campaign
      - CampaignKind
      - CampaignEquipment
      - CampaignSamplingLocation
      - DataProvenanceKind
      - ProcessingStep
      - ProcessingLineage
      - OperationKind

  annotations:
    name: Annotations
    color: "#65a30d"
    tables:
      - Annotation
      - AnnotationKind

  control_loops:
    name: Control Loops
    color: "#db2777"
    tables:
      - ControlLoop
      - ControlLoopApplication
      - ControlLoopPort
      - ControlLoopPortKind
      - ControllerKind

  reference:
    name: Reference & Vocabulary
    color: "#64748b"
    tables:
      - Parameter
      - ParameterHasUnit
      - Unit
      - Person
      - Procedures
      - ProcedureKind
      - QualityCode

  system:
    name: System & Audit
    color: "#334155"
    tables:
      - SchemaVersion
      - AuditLog
      - UserAccount

# Global settings
settings:
  default_group_name: Uncategorized
  default_color: "#6b7280"
  view_group_name: Views
  view_color: "#0284c7"
