<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>datEAUbase ERD</title>
    
    <!-- JointJS and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.1/backbone-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.1/joint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/graphlib/2.1.8/graphlib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Styling -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.1/joint.min.css" />

    <style>
        :root {
            --bg-color: #f0f2f5;
            --table-bg: #ffffff;
            --table-border: #e2e8f0;
            --header-bg: #f8fafc;
            --header-text: #1e293b;
            --text-primary: #334155;
            --text-secondary: #64748b;
            --accent-color: #3b82f6;
            --pk-color: #eab308;
            --fk-color: #8b5cf6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        #paper {
            flex-grow: 1;
            overflow: hidden;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- Custom HTML Element Styles --- */
        .html-element {
            position: absolute;
            background: var(--table-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--table-border);
            pointer-events: auto; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.2s ease; /* transition removed for transform to avoid lag during drag */
            transform-origin: 0 0;
            z-index: 100 !important; /* Ensure it floats above SVG */
        }

        /* Add cursor styles */
        .table-header {
            cursor: move; /* Indicate draggable */
        }
        .info-btn {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .info-btn:hover {
            background-color: #e2e8f0;
        }
        .html-element.selected {
            box-shadow: 0 0 0 2px var(--accent-color), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100 !important;
        }

        .table-header {
            background: var(--header-bg);
            padding: 8px 12px;
            border-bottom: 1px solid var(--table-border);
            font-weight: 600;
            font-size: 14px;
            color: var(--header-text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: auto; /* Allow dragging from header */
        }

        .table-body {
            pointer-events: auto;
        }

        .table-row {
            display: flex;
            padding: 6px 12px;
            font-size: 12px;
            border-bottom: 1px solid #f1f5f9;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        /* --- View-specific styles --- */
        .html-element.view {
            border: 2px dashed #3b82f6;
            background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
        }

        .html-element.view .table-header {
            background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
            color: #1e40af;
        }

        .view-badge {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: 500;
        }

        .table-row:hover {
            background: #f8fafc;
        }

        .col-key {
            width: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            margin-right: 8px;
        }

        .col-name {
            flex-grow: 1;
            font-weight: 500;
            color: var(--text-primary);
            margin-right: 12px;
        }

        .col-type {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            font-size: 11px;
        }

        .pk-badge { color: var(--pk-color); }
        .fk-badge { color: var(--fk-color); }

        /* --- Sidebar Styles --- */
        #sidebar {
            width: 300px;
            background: white;
            border-left: 1px solid var(--table-border);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            box-shadow: -4px 0 15px rgba(0,0,0,0.05);
            z-index: 1000;
        }

        #sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--table-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-secondary);
        }

        .sidebar-content {
            padding: 16px;
            overflow-y: auto;
        }

        .field-detail {
            margin-bottom: 16px;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.5;
        }
        
        .type-tag {
            display: inline-block;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        /* --- Toolbar --- */
        .toolbar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 8px;
            z-index: 999;
        }

        .tool-btn {
            padding: 8px 12px;
            background: var(--header-bg);
            border: 1px solid var(--table-border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #e2e8f0;
        }

        .tool-btn.primary {
            background: var(--accent-color);
            color: white;
            border: none;
        }
        
        .tool-btn.primary:hover {
            background: #2563eb;
        }

        /* --- Legend --- */
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 999;
            max-width: 200px;
        }

        #legend-toggle {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0;
        }

        #legend-body {
            display: none;
            margin-top: 8px;
        }

        #legend-body.open {
            display: block;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-size: 12px;
            color: var(--text-primary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .legend-label {
            line-height: 1;
        }

    </style>
</head>
<body>

    <div class="toolbar">
        <button class="tool-btn primary" onclick="autoLayout()">Auto Layout</button>
        <button class="tool-btn" onclick="zoomIn()">+</button>
        <button class="tool-btn" onclick="zoomOut()">-</button>
        <button class="tool-btn" onclick="exportPNG()">Save as PNG</button>
        <button class="tool-btn" onclick="exportSVG()">Save as SVG</button>
    </div>

    <div id="paper"></div>

    <div id="legend">
        <div id="legend-toggle" onclick="document.getElementById('legend-body').classList.toggle('open')">
            ▶ Legend
        </div>
        <div id="legend-body">
<div class="legend-item"><span class="legend-dot" style="background:#2563eb"></span><span class="legend-label">Site & Facility</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#059669"></span><span class="legend-label">Equipment & Instruments</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#7c3aed"></span><span class="legend-label">Signal / Channel</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#dc2626"></span><span class="legend-label">Observations & Values</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#0891b2"></span><span class="legend-label">Lab</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#d97706"></span><span class="legend-label">Campaign & Provenance</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#4d7c0f"></span><span class="legend-label">Annotations</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#be123c"></span><span class="legend-label">Control Loops</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#475569"></span><span class="legend-label">Lookup / Reference</span></div>
<div class="legend-item"><span class="legend-dot" style="background:#0284c7"></span><span class="legend-label">Views</span></div>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Field Details</span>
            <button class="close-btn" onclick="closeSidebar()">×</button>
        </div>
        <div class="sidebar-content" id="sidebar-details">
            <div class="detail-value" style="color: var(--text-secondary); font-style: italic;">
                Select a field to view details.
            </div>
        </div>
    </div>

    <script>
        const erdData = {
  "tables": [
    {
      "id": "AnalysisSeries",
      "label": "AnalysisSeries",
      "description": "Stable stream identity for lab measurements \u2014 the lab analogue of Channel. One AnalysisSeries row represents the conceptual stream of \"Parameter X measured at SamplingPoint Y by ProcessingKind Z producing ValueKind W in Unit U\" (e.g. \"TSS Gravimetric at Effluent in mg/L\"). All LabAnalyses measuring the same parameter at the same location with the same processing and value kind share one AnalysisSeries_ID, giving lab data a queryable time-series identity.\nUnlike Channel \u2014 which intentionally excludes sampling location from its identity because location is inferred at query time via EquipmentLocationHistory \u2014 AnalysisSeries includes SamplingPoint_ID as explicit identity, because lab samples always have a known origin and \"TSS at Influent\" must be a different series from \"TSS at Effluent\".\n",
      "fields": [
        {
          "name": "AnalysisSeries_ID",
          "sql_type": "INT",
          "is_pk": true,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Surrogate primary key"
        },
        {
          "name": "Name",
          "sql_type": "NVARCHAR(200)",
          "is_pk": false,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Human-readable label (e.g. 'TSS Gravimetric at Effluent')"
        },
        {
          "name": "Parameter_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": true,
          "fk_target": "Parameter.Parameter_ID",
          "description": "Measured analyte (e.g. TSS concentration, COD concentration)"
        },
        {
          "name": "SamplingPoint_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": true,
          "fk_target": "SamplingPoint.SamplingPoint_ID",
          "description": "Sampling point where the samples for this series originate"
        },
        {
          "name": "ValueKind_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": true,
          "fk_target": "ValueKind.ValueKind_ID",
          "description": "Shape of stored values (1=Scalar, 2=Vector, 3=Matrix, 4=Image)"
        },
        {
          "name": "Unit_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": true,
          "fk_target": "Unit.Unit_ID",
          "description": "Unit of measurement for values in this series (e.g. mg/L). Treated as immutable for the lifetime of the series \u2014 a unit change requires a new AnalysisSeries row. Excluded from the uniqueness constraint because unit choice is a property of the series rather than part of its identity; two series with the same parameter / location / processing / value kind cannot legitimately differ only by unit.\n"
        },
        {
          "name": "ProcessingKind_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": true,
          "fk_target": "ProcessingKind.ProcessingKind_ID",
          "description": "How values in this series were produced (1=Raw, ...). Supports raw vs. corrected lab series for the same parameter at the same location.\n"
        },
        {
          "name": "Campaign_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": false,
          "fk_target": "Campaign.Campaign_ID",
          "description": "Campaign this series belongs to; scopes the series to a specific monitoring campaign"
        },
        {
          "name": "Description",
          "sql_type": "NVARCHAR(MAX)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Free-text notes about this analysis series"
        }
      ],
      "group_name": "Uncategorized",
      "group_color": "#6b7280"
    },
    {
      "id": "AnalysisSeriesAxis",
      "label": "AnalysisSeriesAxis",
      "description": "Junction table linking an AnalysisSeries to its binning axis or axes (analogous to ChannelAxis for sensor channels). AxisRole=0 is the single axis for a Vector series, or the row axis for a Matrix series; AxisRole=1 is the column axis for a Matrix series.\n",
      "fields": [
        {
          "name": "AnalysisSeries_ID",
          "sql_type": "INT",
          "is_pk": true,
          "is_fk": true,
          "is_required": true,
          "fk_target": "AnalysisSeries.AnalysisSeries_ID",
          "description": "References the lab analysis series"
        },
        {
          "name": "AxisRole",
          "sql_type": "INT",
          "is_pk": true,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Dimension role: 0 = primary/row axis, 1 = secondary/column axis (Matrix only)"
        },
        {
          "name": "ValueBinningAxis_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": true,
          "fk_target": "ValueBinningAxis.ValueBinningAxis_ID",
          "description": "References the binning axis for this role"
        }
      ],
      "group_name": "Uncategorized",
      "group_color": "#6b7280"
    },
    {
      "id": "Annotation",
      "label": "Annotation",
      "description": "Human-authored annotations on time series data. Each annotation anchors to a single measurement stream \u2014 either a sensor Channel (Channel_ID NOT NULL, AnalysisSeries_ID NULL) or a lab AnalysisSeries (AnalysisSeries_ID NOT NULL, Channel_ID NULL) \u2014 over a time range; an XOR CHECK constraint (CK_Annotation_Source) enforces that exactly one is set per row. Multiple annotations can overlap on the same range. EndTime=NULL means either a point annotation or an ongoing situation.\n",
      "fields": [
        {
          "name": "Annotation_ID",
          "sql_type": "INT",
          "is_pk": true,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Primary key, auto-incremented"
        },
        {
          "name": "Channel_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": false,
          "fk_target": "Channel.Channel_ID",
          "description": "The sensor channel this annotation applies to. NULL for lab annotations (which set AnalysisSeries_ID instead). Exactly one of Channel_ID / AnalysisSeries_ID is non-NULL per row (XOR CHECK).\n"
        },
        {
          "name": "AnalysisSeries_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": false,
          "fk_target": "AnalysisSeries.AnalysisSeries_ID",
          "description": "The lab analysis series this annotation applies to. NULL for sensor annotations (which set Channel_ID instead). Exactly one of Channel_ID / AnalysisSeries_ID is non-NULL per row (XOR CHECK).\n"
        },
        {
          "name": "AnnotationKind_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": true,
          "fk_target": "AnnotationKind.AnnotationKind_ID",
          "description": "What kind of annotation this is"
        },
        {
          "name": "StartTime",
          "sql_type": "DATETIME2(7)",
          "is_pk": false,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Start of the annotated time range"
        },
        {
          "name": "EndTime",
          "sql_type": "DATETIME2(7)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "End of the annotated range. NULL = point annotation or ongoing"
        },
        {
          "name": "AuthorPerson_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": false,
          "fk_target": "Person.Person_ID",
          "description": "Person who created this annotation"
        },
        {
          "name": "Campaign_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": false,
          "fk_target": "Campaign.Campaign_ID",
          "description": "Campaign this annotation is associated with, if any"
        },
        {
          "name": "EquipmentEvent_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": false,
          "fk_target": "EquipmentEvent.EquipmentEvent_ID",
          "description": "Equipment event that caused this annotation, if any"
        },
        {
          "name": "Title",
          "sql_type": "NVARCHAR(200)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Short title for the annotation"
        },
        {
          "name": "Comment",
          "sql_type": "NVARCHAR(MAX)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Detailed free-text comment"
        },
        {
          "name": "CreatedDateTime",
          "sql_type": "DATETIME2(7)",
          "is_pk": false,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "When this annotation was created"
        },
        {
          "name": "ModifiedDateTime",
          "sql_type": "DATETIME2(7)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "When this annotation was last modified"
        },
        {
          "name": "Observation_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": false,
          "fk_target": "Observation.Observation_ID",
          "description": "Optional link to a specific Observation for point-level annotations (e.g., 'wrong focal length on this image'). Valid for either anchor: for a sensor annotation it pins one Channel Observation; for a lab annotation it pins one Replicate (the Observation backing a single AnalysisSeries reading). When NULL, the annotation applies to the time range [StartTime, EndTime] on the anchored stream. When set, StartTime should match Observation.Timestamp.\n"
        }
      ],
      "group_name": "Annotations",
      "group_color": "#4d7c0f"
    },
    {
      "id": "AnnotationKind",
      "label": "AnnotationKind",
      "description": "Controlled vocabulary defining the kinds of annotations that can be applied to time series data. Each kind has a display color for UI rendering.\n",
      "fields": [
        {
          "name": "AnnotationKind_ID",
          "sql_type": "INT",
          "is_pk": true,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Primary key, manually assigned"
        },
        {
          "name": "Name",
          "sql_type": "NVARCHAR(100)",
          "is_pk": false,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Human-readable name of the annotation kind"
        },
        {
          "name": "Description",
          "sql_type": "NVARCHAR(500)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Explanation of when to use this annotation kind"
        },
        {
          "name": "Color",
          "sql_type": "NVARCHAR(7)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Hex color code for UI rendering, e.g. '#FF6B6B'"
        }
      ],
      "group_name": "Uncategorized",
      "group_color": "#6b7280"
    },
    {
      "id": "AuditLog",
      "label": "AuditLog",
      "description": "Immutable log of user-initiated actions on API resources.",
      "fields": [
        {
          "name": "AuditLog_ID",
          "sql_type": "BIGINT",
          "is_pk": true,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Surrogate primary key"
        },
        {
          "name": "UserAccount_ID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": true,
          "is_required": false,
          "fk_target": "UserAccount.UserAccount_ID",
          "description": "User who performed the action (NULL for unauthenticated events)"
        },
        {
          "name": "Action",
          "sql_type": "NVARCHAR(50)",
          "is_pk": false,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Action verb: CREATE | UPDATE | DELETE | LOGIN | SIGNUP"
        },
        {
          "name": "ResourceType",
          "sql_type": "NVARCHAR(100)",
          "is_pk": false,
          "is_fk": false,
          "is_required": true,
          "fk_target": null,
          "description": "Type of resource affected (e.g. UserAccount, Site, Campaign)"
        },
        {
          "name": "ResourceID",
          "sql_type": "NVARCHAR(255)",
          "is_pk": false,

  "views": [
    {
      "id": "vw_ChannelEquipmentAtTime",
      "label": "vw_ChannelEquipmentAtTime",
      "description": "Resolves, for every Observation, which physical Equipment was wired to the Channel at the time of the observation. Walks EquipmentWiringHistory by matching SignalInterface_ID (and, when the Channel's port is known, SignalInterfacePort_ID) and bracketing (ValidFrom, ValidTo]. When a Channel has no port recorded and multiple Equipment share the interface at the same time, EquipmentID is NULL and Resolution = 'ambiguous'.\n",
      "view_definition": "WITH channel_wiring AS (\n    SELECT\n        o.[Observation_ID] AS ObservationID,\n        c.[Channel_ID]     AS ChannelID,\n        o.[Timestamp]      AS Timestamp,\n        c.[SignalInterface_ID],\n        c.[SignalInterfacePort_ID],\n        ewh.[Equipment_ID] AS EquipmentID,\n        ROW_NUMBER() OVER (\n            PARTITION BY o.[Observation_ID]\n            ORDER BY\n                CASE WHEN ewh.[SignalInterfacePort_ID] IS NOT NULL THEN 0 ELSE 1 END,\n                ewh.[ValidFrom] DESC\n        ) AS rn,\n        COUNT(*) OVER (PARTITION BY o.[Observation_ID]) AS match_count\n    FROM [dbo].[Observation] o\n    JOIN [dbo].[Channel] c                      ON c.[Channel_ID]           = o.[Channel_ID]\n    LEFT JOIN [dbo].[EquipmentWiringHistory] ewh ON ewh.[SignalInterface_ID] = c.[SignalInterface_ID]\n                                                AND (\n                                                     ewh.[SignalInterfacePort_ID] = c.[SignalInterfacePort_ID]\n                                                     OR (ewh.[SignalInterfacePort_ID] IS NULL AND c.[SignalInterfacePort_ID] IS NULL)\n                                                     OR c.[SignalInterfacePort_ID] IS NULL\n                                                    )\n                                                AND ewh.[ValidFrom] <= o.[Timestamp]\n                                                AND (ewh.[ValidTo] IS NULL OR ewh.[ValidTo] > o.[Timestamp])\n)\nSELECT\n    cw.ObservationID,\n    cw.ChannelID,\n    cw.Timestamp,\n    CASE WHEN cw.match_count > 1 AND cw.[SignalInterfacePort_ID] IS NULL THEN NULL ELSE cw.EquipmentID END AS EquipmentID,\n    e.[Identifier]     AS EquipmentName,\n    CASE\n        WHEN cw.EquipmentID IS NULL AND cw.match_count = 0 THEN N'unlinked'\n        WHEN cw.match_count > 1 AND cw.[SignalInterfacePort_ID] IS NULL THEN N'ambiguous'\n        ELSE N'resolved'\n    END AS Resolution\nFROM channel_wiring cw\nLEFT JOIN [dbo].[Equipment] e ON e.[Equipment_ID] = cw.EquipmentID\nWHERE cw.rn = 1\n",
      "columns": [
        {
          "name": "ObservationID",
          "sql_type": "BIGINT",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Observation row"
        },
        {
          "name": "ChannelID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Channel this observation belongs to"
        },
        {
          "name": "Timestamp",
          "sql_type": "DATETIME2(7)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Observation timestamp used for resolution"
        },
        {
          "name": "EquipmentID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Equipment wired at this time (NULL if unresolved / ambiguous)"
        },
        {
          "name": "EquipmentName",
          "sql_type": "NVARCHAR(200)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "Identifier of the resolved equipment"
        },
        {
          "name": "Resolution",
          "sql_type": "NVARCHAR(20)",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,
          "fk_target": null,
          "description": "'resolved' | 'unlinked' | 'ambiguous'"
        }
      ],
      "group_name": "Views",
      "group_color": "#0284c7"
    },
    {
      "id": "vw_ChannelLocationAtTime",
      "label": "vw_ChannelLocationAtTime",
      "description": "Resolves the SamplingPoint a Channel was sampling at the time of each Observation, by composing vw_ChannelEquipmentAtTime with EquipmentLocationHistory. When equipment cannot be resolved (ambiguous or unlinked wiring), SamplingPointID is NULL.\n",
      "view_definition": "SELECT\n    cea.ObservationID,\n    cea.ChannelID,\n    cea.Timestamp,\n    cea.EquipmentID,\n    elh.[SamplingPoint_ID] AS SamplingPointID,\n    sp.[SamplingPoint]     AS SamplingPointName\nFROM [dbo].[vw_ChannelEquipmentAtTime] cea\nLEFT JOIN [dbo].[EquipmentLocationHistory] elh ON elh.[Equipment_ID] = cea.EquipmentID\n                                              AND elh.[ValidFrom]   <= cea.Timestamp\n                                              AND (elh.[ValidTo] IS NULL OR elh.[ValidTo] > cea.Timestamp)\nLEFT JOIN [dbo].[SamplingPoint] sp ON sp.[SamplingPoint_ID] = elh.[SamplingPoint_ID]\n",
      "columns": [

    {
      "id": "vw_ChannelStatus",
      "label": "vw_ChannelStatus",
      "description": "Per-channel sensor status view. A status channel is a Channel whose ChannelRole = Status and whose ParentChannel_ID points at the measured value Channel. The equipment behind the value channel is resolved via the new EquipmentWiringHistory table (v4.0.0).\n",
      "view_definition": "SELECT\n    statusC.[Channel_ID]      AS StatusChannelID,\n    valueC.[Channel_ID]       AS MeasurementChannelID,\n    e.[Equipment_ID]          AS EquipmentID,\n    e.[Identifier]            AS EquipmentName,\n    p.[Parameter]             AS MeasurementParameter,\n    o.[Timestamp],\n    CAST(v.[Value] AS INT)    AS StatusCodeID\nFROM [dbo].[Value] v\nJOIN [dbo].[Observation]   o       ON o.[Observation_ID]   = v.[Observation_ID]\nJOIN [dbo].[Channel]       statusC ON statusC.[Channel_ID] = o.[Channel_ID]\nJOIN [dbo].[ChannelKind]   role    ON role.[ChannelKind_ID] = statusC.[ChannelKind_ID]\nJOIN [dbo].[Channel]       valueC  ON valueC.[Channel_ID]   = statusC.[ParentChannel_ID]\nJOIN [dbo].[Parameter]     p       ON p.[Parameter_ID]     = valueC.[Parameter_ID]\nLEFT JOIN [dbo].[EquipmentWiringHistory] ewh\n       ON ewh.[SignalInterface_ID] = valueC.[SignalInterface_ID]\n      AND (\n           ewh.[SignalInterfacePort_ID] = valueC.[SignalInterfacePort_ID]\n           OR valueC.[SignalInterfacePort_ID] IS NULL\n          )\n      AND ewh.[ValidTo] IS NULL\nLEFT JOIN [dbo].[Equipment] e ON e.[Equipment_ID] = ewh.[Equipment_ID]\nWHERE role.[Name] = N'Status'\n  AND statusC.[ParentChannel_ID] IS NOT NULL\n",
      "columns": [
        {
          "name": "StatusChannelID",
          "sql_type": "INT",
          "is_pk": false,
          "is_fk": false,
          "is_required": false,

      "key": "annotations",
      "name": "Annotations",
      "color": "#4d7c0f"
    },
    {
      "key": "control_loops",
      "name": "Control Loops",
      "color": "#be123c"
    },
    {
      "key": "reference",
      "name": "Lookup / Reference",
      "color": "#475569"
    }
  ],
  "settings": {
    "default_group_name": "Uncategorized",
    "default_color": "#6b7280",
    "view_group_name": "Views",
    "view_color": "#0284c7"
  }
};

        // --- Custom HTML Element Definition ---
        joint.shapes.html = {};
        joint.shapes.html.Element = joint.shapes.standard.Rectangle.extend({
            defaults: joint.util.deepSupplement({
                type: 'html.Element',
                attrs: {
                    rect: { stroke: 'none', 'fill-opacity': 0 } // Invisible SVG rect
                }
            }, joint.shapes.standard.Rectangle.prototype.defaults)
        });

        joint.shapes.html.ElementView = joint.dia.ElementView.extend({
            htmlTemplate: null,

            initialize: function() {
                joint.dia.ElementView.prototype.initialize.apply(this, arguments);

                // Create the DIV that will mock the element
                this.div = document.createElement('div');
                this.div.className = 'html-element';
                this.div.id = this.model.id;

                // Check if this is a view
                if (this.model.get('isView')) {
                    this.div.classList.add('view');
                }

                // Apply group color as a colored left border accent
                const _data = this.model.get('isView') ? this.model.get('viewData') : this.model.get('tableData');
                if (_data && _data.group_color && !this.model.get('isView')) {
                    this.div.style.borderLeft = `4px solid ${_data.group_color}`;
                }

                // Prevent paper panning when clicking on the element
                this.div.addEventListener('mousedown', (e) => {
                    // We handle our own interactions
                    e.stopPropagation();

                    // Visual Selection
                    document.querySelectorAll('.html-element').forEach(el => el.classList.remove('selected'));
                    this.div.classList.add('selected');
                });

                this.renderContent();
                this.model.on('change', this.updateBox, this);
            },
            renderContent: function() {
                const isView = this.model.get('isView');
                const data = isView ? this.model.get('viewData') : this.model.get('tableData');

                // URL-encode for safe embedding in onclick attribute strings
                const entityJson = encodeURIComponent(JSON.stringify({
                    name: data.label,
                    description: data.description,
                    type: isView ? 'view' : 'table',
                    definition: data.view_definition || null
                }));

                let rowsHtml = '';
                const items = isView ? data.columns : data.fields;

                items.forEach(field => {
                    let keyBadge = '';
                    if (field.is_pk) keyBadge = '<span class="pk-badge" title="Primary Key">PK</span>';
                    else if (field.is_fk) keyBadge = '<span class="fk-badge" title="Foreign Key">FK</span>';

                    // Add asterisk for required fields
                    const requiredMarker = field.is_required ? '<span style="color: #ef4444;">*</span>' : '';

                    const fieldJson = encodeURIComponent(JSON.stringify(field));

                    rowsHtml += `
                        <div class="table-row" onclick="showFieldDetails('${fieldJson}', '${data.label}', event)">
                            <div class="col-key">${keyBadge}</div>
                            <div class="col-name" title="${field.name}">${field.name}${requiredMarker}</div>
                            <div class="col-type" title="${field.sql_type}">${field.sql_type}</div>
                        </div>
                    `;
                });

                const badgeHtml = isView ? '<span class="view-badge">VIEW</span>' : '';
                const headerBg = (!isView && data.group_color) ? data.group_color + '18' : '';
                const headerStyle = headerBg ? `style="background:${headerBg}"` : '';

                this.div.innerHTML = `
                    <div class="table-header" ${headerStyle} onmousedown="startDrag(event, '${this.model.id}')">
                        <span>${data.label}</span>${badgeHtml}
                        <span class="info-btn" onclick="showTableDetails('${entityJson}', event)">ℹ️</span>
                    </div>
                    <div class="table-body">
                        ${rowsHtml}
                    </div>
                `;
            },
            render: function() {
                joint.dia.ElementView.prototype.render.apply(this, arguments);
                
                // Add the DIV to the paper container
                // We use paper.el to ensure it's in the same container
                // Append ensures it is visually on top of the SVG if z-index is equal (but we forced z-index 100)
                this.paper.$el.append(this.div);
                
                this.updateBox();
                return this;
            },

            updateBox: function() {
                const bbox = this.model.getBBox();
                const scale = this.paper.scale();
                const tr = this.paper.translate();

                this.div.style.transform = `translate(${bbox.x * scale.sx + tr.tx}px, ${bbox.y * scale.sy + tr.ty}px) scale(${scale.sx})`;
                this.div.style.transformOrigin = '0 0';
                this.div.style.width = bbox.width + 'px';
                this.div.style.height = bbox.height + 'px';
                this.div.style.left = '0';
                this.div.style.top = '0';
            },

            remove: function() {
                // Clean up
                if (this.div) this.div.remove();
                joint.dia.ElementView.prototype.remove.apply(this, arguments);
            }
        });

        // --- Init Graph ---
        const graph = new joint.dia.Graph();
        const paper = new joint.dia.Paper({
            el: document.getElementById('paper'),
            model: graph,
            width: '100%',
            height: '100%',
            gridSize: 10,
            drawGrid: true,
            background: { color: '#f0f2f5' },
            interactive: { linkMove: false }, // Allow element move, deny link move
            defaultRouter: { name: 'manhattan' },
            defaultConnector: { name: 'rounded' }
        });

        // --- Build Graph ---
        const tableElements = {};

        // 1. Create Nodes
        erdData.tables.forEach(table => {
            // Dynamic Width Calculation
            // Estimate text width: Label vs (Fields Name + Type)
            let maxChars = table.label.length;
            table.fields.forEach(f => {
                // Name + Type + Spacing
                const lineLength = f.name.length + f.sql_type.length + 5;
                if (lineLength > maxChars) maxChars = lineLength;
            });
            
            // Approx 10px per char + liberal padding
            let calculatedWidth = (maxChars * 10) + 80;
            // Clamping - Minimum width based on style preference
            if (calculatedWidth < 280) calculatedWidth = 280;
            if (calculatedWidth > 700) calculatedWidth = 700;

            // Calculate approximate height
            const headerHeight = 40;
            const rowHeight = 30; 
            // Add extra buffer + border
            const height = headerHeight + (table.fields.length * rowHeight) + 10; 

            const element = new joint.shapes.html.Element({
                position: { x: 0, y: 0 }, // Will be set by Layout
                size: { width: calculatedWidth, height: height },
                tableData: table // Pass full data to view
            });

            element.addTo(graph);
            tableElements[table.id] = element;
        });

        // 1b. Create View Nodes (with distinct styling)
        const viewElements = {};
        erdData.views.forEach(view => {
            // Dynamic Width Calculation
            let maxChars = view.label.length;
            view.columns.forEach(col => {
                const lineLength = col.name.length + col.sql_type.length + 5;
                if (lineLength > maxChars) maxChars = lineLength;
            });

            let calculatedWidth = (maxChars * 10) + 80;
            if (calculatedWidth < 280) calculatedWidth = 280;
            if (calculatedWidth > 700) calculatedWidth = 700;

            const headerHeight = 40;
            const rowHeight = 30;
            const height = headerHeight + (view.columns.length * rowHeight) + 10;

            const viewElement = new joint.shapes.html.Element({
                position: { x: 0, y: 0 },
                size: { width: calculatedWidth, height: height },
                viewData: view,
                isView: true
            });

            viewElement.addTo(graph);
            viewElements[view.id] = viewElement;
        });

        // Helper function to determine cardinality markers
        function getCardinalityMarkers(relType) {
            // Returns { sourceMarker, targetMarker } based on relationship type
            // Convention: arrow points from child (FK holder) to parent (PK holder)

            // Crow's foot marker (many side) - three lines spreading out
            const crowsFoot = {
                type: 'path',
                d: 'M 0 -5 L 10 0 L 0 5 M 10 0 L 10 -5 M 10 0 L 10 5',
                fill: 'none'
            };

            // Single line marker (one side)
            const oneLine = {
                type: 'path',
                d: 'M 10 -5 L 10 5',
                fill: 'none'
            };

            if (relType === 'one-to-one') {
                // One-to-one: single line on both ends
                return {
                    sourceMarker: oneLine,  // Child end (one)
                    targetMarker: oneLine   // Parent end (one)
                };
            } else if (relType === 'one-to-many') {
                // One-to-many: crow's foot on child (source), single line on parent (target)
                return {
                    sourceMarker: crowsFoot,  // Child end (many)
                    targetMarker: oneLine     // Parent end (one)
                };
            } else if (relType === 'many-to-many') {
                // Many-to-many: crow's foot on both ends
                return {
                    sourceMarker: crowsFoot,  // Many end
                    targetMarker: crowsFoot   // Many end
                };
            }

            // Default to one-to-many
            return {
                sourceMarker: crowsFoot,
                targetMarker: oneLine
            };
        }

        // 2. Create Links
        erdData.relationships.forEach(rel => {
            const source = tableElements[rel.from_table];
            const target = tableElements[rel.to_table];

            if (source && target) {
                const markers = getCardinalityMarkers(rel.relationship_type);

                const link = new joint.shapes.standard.Link({
                    source: { id: source.id },
                    target: { id: target.id },
                    relationshipData: rel, // Store data for click handler
                    attrs: {
                        line: {
                            stroke: '#94a3b8',
                            strokeWidth: 2,
                            sourceMarker: markers.sourceMarker,
                            targetMarker: markers.targetMarker
                        }
                    },
                    connector: { name: 'rounded' },
                    router: {
                        name: 'manhattan',
                        args: {
                            padding: 20,
                            step: 20,
                            startDirections: ['right'],
                            endDirections: ['left']
                        }
                    }
                });
                link.addTo(graph);
            }
        });

        // --- Auto Layout (dagre-based, no dependency on joint.layout.DirectedGraph) ---
        function autoLayout() {
            try {
                // Build a dagre graph from the JointJS graph
                const g = new dagre.graphlib.Graph();
                g.setGraph({ rankdir: 'LR', nodesep: 60, ranksep: 120, marginx: 50, marginy: 50 });
                g.setDefaultEdgeLabel(function() { return {}; });

                // Add nodes
                graph.getElements().forEach(function(el) {
                    const size = el.size();
                    g.setNode(el.id, { width: size.width, height: size.height });
                });

                // Add edges
                graph.getLinks().forEach(function(link) {
                    const src = link.getSourceElement();
                    const tgt = link.getTargetElement();
                    if (src && tgt) { g.setEdge(src.id, tgt.id); }
                });

                // Run layout
                dagre.layout(g);

                // Apply positions back to JointJS models
                g.nodes().forEach(function(nodeId) {
                    const n = g.node(nodeId);
                    const el = graph.getCell(nodeId);
                    if (el && n) {
                        // dagre positions are center-based; JointJS uses top-left
                        el.position(n.x - n.width / 2, n.y - n.height / 2);
                    }
                });

                paper.scaleContentToFit({ padding: 50, maxScale: 1 });
                currentScale = paper.scale().sx;
            } catch (e) {
                console.error('Auto-layout failed:', e);
                alert('Auto-layout failed: ' + e.message);
            }
        }

        // Initial Layout
        setTimeout(autoLayout, 100);

        // --- Interaction ---
        
        // Zoom-Pan
        let currentScale = 1;
        const paperEl = document.getElementById('paper');
        
        // Pan logic
        let isPanning = false;
        let startPan = { x: 0, y: 0 };
        let initialPan = { x: 0, y: 0 };

        paper.on('blank:pointerdown', (evt, x, y) => {
            isPanning = true;
            startPan = { x: evt.clientX, y: evt.clientY };
            initialPan = paper.translate();
            paperEl.style.cursor = 'grabbing';
            closeSidebar(); // Also close sidebar on blank click
        });

        // Native Wheel Zoom (better for trackpads)
        paperEl.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            
            // Normalize delta
            const delta = -Math.sign(evt.deltaY) * 0.1;
            const oldScale = currentScale;
            let newScale = oldScale + delta;
            
            // Clamp
            if (newScale < 0.2) newScale = 0.2;
            if (newScale > 3) newScale = 3;
            
            if (newScale !== oldScale) {
                currentScale = newScale;
                
                // Zoom towards mouse cursor
                // We need to calculate the new offset to keep the point under cursor stable
                // Current mouse position in DOM
                const rect = paperEl.getBoundingClientRect();
                const mouseX = evt.clientX - rect.left;
                const mouseY = evt.clientY - rect.top;
                
                // Convert mouse to graph coordinates (using OLD scale)
                const tr = paper.translate();
                const graphX = (mouseX - tr.tx) / oldScale;
                const graphY = (mouseY - tr.ty) / oldScale;
                
                // New Translate = Mouse - (Graph * NewScale)
                const newTx = mouseX - (graphX * newScale);
                const newTy = mouseY - (graphY * newScale);
                
                paper.scale(newScale, newScale);
                paper.translate(newTx, newTy);
                
                // Update HTML elements (scale event also handles this, but explicit check good)
            }
        }, { passive: false });
        
        // Custom Drag Logic for HTML Elements
        let isDraggingBox = false;
        let dragElementId = null;
        let dragStartOffset = { x: 0, y: 0 };
        
        function startDrag(evt, modelId) {
            // evt.preventDefault(); // allow text selection? No, header.
            isDraggingBox = true;
            dragElementId = modelId;
            
            const tr = paper.translate();
            const sc = paper.scale().sx;
            const model = graph.getCell(modelId);
            const pos = model.position();
            
            // Calculate where we clicked relative to model pos
            // Mouse (client) -> Graph Coords
            // But easier: just track delta from mouse down.
            // Wait, we need to update MODEL position.
            
            // Mouse Client X/Y
            // We'll track MovementX/Y in mousemove? No, that's unreliable.
            // Let's track absolute start.
            
            // Store original model position
            dragStartOffset = {
                clickX: evt.clientX,
                clickY: evt.clientY,
                modelX: pos.x,
                modelY: pos.y
            };
            
            paperEl.style.cursor = 'move';
        }


        // Global Mouse Move (handles both pan and box drag)
        document.addEventListener('mousemove', (evt) => {
            if (isPanning) {
                const dx = evt.clientX - startPan.x;
                const dy = evt.clientY - startPan.y;
                paper.translate(initialPan.tx + dx, initialPan.ty + dy);
            }
            
            if (isDraggingBox && dragElementId) {
                const dx = evt.clientX - dragStartOffset.clickX;
                const dy = evt.clientY - dragStartOffset.clickY;
                
                // Convert screen delta to graph delta
                // deltaGraph = deltaScreen / scale
                const sc = paper.scale().sx;
                const dGraphX = dx / sc;
                const dGraphY = dy / sc;
                
                const model = graph.getCell(dragElementId);
                model.position(dragStartOffset.modelX + dGraphX, dragStartOffset.modelY + dGraphY);
                
                // Links update automatically because model updates
            }
        });
        
        document.addEventListener('mouseup', () => {
            isPanning = false;
            isDraggingBox = false;
            dragElementId = null;
            paperEl.style.cursor = 'default';
        });
        
        // Link Click Handler
        paper.on('link:pointerdown', (linkView) => {
            const rel = linkView.model.get('relationshipData');
            if (!rel) return; // Guard against regular links if any
            
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-details');
            
            content.innerHTML = `
                <div class="field-detail">
                    <div class="detail-label">Relationship</div>
                    <div class="type-tag">Foreign Key</div>
                </div>
                <div class="field-detail">
                    <div class="detail-label">Foreign Table (Many)</div>
                    <div class="detail-value">
                        <strong>${rel.from_table}</strong>.${rel.from_field}
                    </div>
                </div>
                <div class="field-detail">
                    <div class="detail-label">Primary Table (One)</div>
                    <div class="detail-value">
                        <strong>${rel.to_table}</strong>.${rel.to_field}
                    </div>
                </div>
                <div class="field-detail">
                    <div class="detail-label">Relationship</div>
                    <div class="detail-value">${rel.relationship_type}</div>
                    <div style="font-size: 11px; color: var(--text-secondary); margin-top: 4px;">
                        ${rel.relationship_type === 'one-to-many' ? 'Many foreign records point to one primary record' : 
                           rel.relationship_type === 'one-to-one' ? 'One foreign record points to one primary record' :
                           'Many foreign records point to many primary records (via junction table)'}
                    </div>
                </div>
            `;
            sidebar.classList.add('open');
            
            // Highlight Link
            graph.getLinks().forEach(l => {
                l.attr('line/stroke', '#94a3b8');
                l.attr('line/strokeWidth', 2);
            });
            
            linkView.model.attr('line/stroke', '#3b82f6');
            linkView.model.attr('line/strokeWidth', 4);
        });
        
        // Paper Transform Listener to sync HTML elements
        // This is crucial. When paper zooms or pans, we must update the CSS transform of a container 
        // OR update every single element. Updating every element is easier for this scale.
        paper.on('render:done translate resize scale', () => {
            // This global update is heavy but ensures sync
            const transform = paper.translate();
            const scale = paper.scale();

            // Iterate all views
            for (const key in paper._views) {
                const view = paper._views[key];
                if (view.updateBox) {
                    const modelBox = view.model.getBBox();
                    // Transform model coordinates to paper coordinates
                    // (x * scale) + tx
                    const tx = transform.tx;
                    const ty = transform.ty;
                    const sx = scale.sx;
                    const sy = scale.sy;
                    
                    // Apply transform directly to the div for scaling and positioning
                    view.div.style.transform = `translate(${modelBox.x * sx + tx}px, ${modelBox.y * sy + ty}px) scale(${sx})`;
                    view.div.style.transformOrigin = '0 0'; // Scale from top-left
                    
                    // Set width/height based on original model size, let scale handle visual size
                    view.div.style.width = modelBox.width + 'px';
                    view.div.style.height = modelBox.height + 'px';
                }
            }
        });

        // --- Toolbar Functions ---
        function zoomIn() { currentScale += 0.1; paper.scale(currentScale); }
        function zoomOut() { currentScale -= 0.1; paper.scale(currentScale); }

        function exportPNG() {
            closeSidebar();

            const bbox = graph.getBBox();
            if (!bbox || bbox.width === 0) {
                alert('Nothing to export.');
                return;
            }

            const padding = 50;
            const width = Math.ceil(bbox.width + padding * 2);
            const height = Math.ceil(bbox.height + padding * 2);

            const originalTransform = paper.translate();
            const originalScale = paper.scale();
            const paperElement = document.getElementById('paper');
            const oldOverflow = paperElement.style.overflow;

            // Reset view so all content fits exactly in [0, width] x [0, height]
            paper.scale(1, 1);
            paper.translate(padding - bbox.x, padding - bbox.y);

            // Temporarily allow overflow so html2canvas can read all positioned children
            paperElement.style.overflow = 'visible';

            // Wait two animation frames for CSS transforms to flush before capture
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    html2canvas(paperElement, {
                        backgroundColor: '#f0f2f5',
                        width: width,
                        height: height,
                        x: 0,
                        y: 0,
                        scrollX: 0,
                        scrollY: 0,
                        useCORS: true,
                        allowTaint: true,
                        scale: 1
                    }).then(function(canvas) {
                        canvas.toBlob(function(blob) {
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.download = 'dateaubase_erd.png';
                            link.href = url;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                        });
                        paperElement.style.overflow = oldOverflow;
                        paper.translate(originalTransform.tx, originalTransform.ty);
                        paper.scale(originalScale.sx, originalScale.sy);
                    }).catch(function(err) {
                        console.error('PNG export error:', err);
                        alert('PNG export failed. See console for details.');
                        paperElement.style.overflow = oldOverflow;
                        paper.translate(originalTransform.tx, originalTransform.ty);
                        paper.scale(originalScale.sx, originalScale.sy);
                    });
                });
            });
        }

        function exportSVG() {
            closeSidebar();

            const bbox = graph.getBBox();
            if (!bbox || bbox.width === 0) {
                alert('Nothing to export.');
                return;
            }

            const padding = 50;
            const NS = 'http://www.w3.org/2000/svg';

            // Start fresh SVG (clone paper SVG for relationship lines)
            const svgClone = paper.svg.cloneNode(true);
            svgClone.setAttribute('xmlns', NS);
            svgClone.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${bbox.width + padding * 2} ${bbox.height + padding * 2}`);
            svgClone.setAttribute('width', String(bbox.width + padding * 2));
            svgClone.setAttribute('height', String(bbox.height + padding * 2));

            // Background
            const bg = document.createElementNS(NS, 'rect');
            bg.setAttribute('x', String(bbox.x - padding));
            bg.setAttribute('y', String(bbox.y - padding));
            bg.setAttribute('width', String(bbox.width + padding * 2));
            bg.setAttribute('height', String(bbox.height + padding * 2));
            bg.setAttribute('fill', '#f0f2f5');
            svgClone.insertBefore(bg, svgClone.firstChild);

            // Helper: create SVG text element
            function svgText(x, y, txt, opts) {
                const t = document.createElementNS(NS, 'text');
                t.setAttribute('x', String(x));
                t.setAttribute('y', String(y));
                t.setAttribute('font-family', opts.mono ? 'monospace' : 'Arial, sans-serif');
                t.setAttribute('font-size', String(opts.size || 12));
                if (opts.weight) t.setAttribute('font-weight', opts.weight);
                t.setAttribute('fill', opts.fill || '#334155');
                if (opts.anchor) t.setAttribute('text-anchor', opts.anchor);
                t.textContent = String(txt).substring(0, 40); // cap length
                return t;
            }

            // Render each table/view as native SVG
            graph.getElements().forEach(function(model) {
                const isView = model.get('isView');
                const data = isView ? model.get('viewData') : model.get('tableData');
                if (!data) return;

                const eb = model.getBBox();
                const HEADER_H = 40;
                const ROW_H = 30;
                const items = isView ? data.columns : data.fields;
                const groupColor = data.group_color || (isView ? '#0284c7' : '#e2e8f0');

                const g = document.createElementNS(NS, 'g');

                // Outer rect
                const outerRect = document.createElementNS(NS, 'rect');
                outerRect.setAttribute('x', String(eb.x));
                outerRect.setAttribute('y', String(eb.y));
                outerRect.setAttribute('width', String(eb.width));
                outerRect.setAttribute('height', String(eb.height));
                outerRect.setAttribute('fill', isView ? '#eff6ff' : '#ffffff');
                outerRect.setAttribute('stroke', isView ? '#3b82f6' : '#e2e8f0');
                outerRect.setAttribute('stroke-width', isView ? '2' : '1');
                outerRect.setAttribute('rx', '8');
                g.appendChild(outerRect);

                // Header background
                const headerRect = document.createElementNS(NS, 'rect');
                headerRect.setAttribute('x', String(eb.x));
                headerRect.setAttribute('y', String(eb.y));
                headerRect.setAttribute('width', String(eb.width));
                headerRect.setAttribute('height', String(HEADER_H));
                headerRect.setAttribute('fill', isView ? '#dbeafe' : (groupColor + '18'));
                headerRect.setAttribute('rx', '8');
                g.appendChild(headerRect);
                // Square off bottom corners of header
                const headerFix = document.createElementNS(NS, 'rect');
                headerFix.setAttribute('x', String(eb.x));
                headerFix.setAttribute('y', String(eb.y + HEADER_H / 2));
                headerFix.setAttribute('width', String(eb.width));
                headerFix.setAttribute('height', String(HEADER_H / 2));
                headerFix.setAttribute('fill', isView ? '#dbeafe' : (groupColor + '18'));
                g.appendChild(headerFix);

                // Group accent border (left side)
                if (!isView) {
                    const accent = document.createElementNS(NS, 'rect');
                    accent.setAttribute('x', String(eb.x));
                    accent.setAttribute('y', String(eb.y));
                    accent.setAttribute('width', '4');
                    accent.setAttribute('height', String(eb.height));
                    accent.setAttribute('fill', groupColor);
                    accent.setAttribute('rx', '8');
                    g.appendChild(accent);
                }

                // Header divider
                const divider = document.createElementNS(NS, 'line');
                divider.setAttribute('x1', String(eb.x));
                divider.setAttribute('y1', String(eb.y + HEADER_H));
                divider.setAttribute('x2', String(eb.x + eb.width));
                divider.setAttribute('y2', String(eb.y + HEADER_H));
                divider.setAttribute('stroke', '#e2e8f0');
                g.appendChild(divider);

                // Header title
                g.appendChild(svgText(eb.x + 14, eb.y + 25, data.label, {
                    size: 13, weight: '600', fill: isView ? '#1e40af' : '#1e293b'
                }));

                // Rows
                items.forEach(function(field, idx) {
                    const rowY = eb.y + HEADER_H + idx * ROW_H;

                    // Row separator
                    const sep = document.createElementNS(NS, 'line');
                    sep.setAttribute('x1', String(eb.x));
                    sep.setAttribute('y1', String(rowY));
                    sep.setAttribute('x2', String(eb.x + eb.width));
                    sep.setAttribute('y2', String(rowY));
                    sep.setAttribute('stroke', '#f1f5f9');
                    g.appendChild(sep);

                    // PK/FK badge
                    if (field.is_pk || field.is_fk) {
                        const badge = field.is_pk ? 'PK' : 'FK';
                        const badgeColor = field.is_pk ? '#ca8a04' : '#7c3aed';
                        g.appendChild(svgText(eb.x + 14, rowY + 19, badge, {
                            size: 9, weight: 'bold', fill: badgeColor
                        }));
                    }

                    // Field name
                    g.appendChild(svgText(eb.x + 32, rowY + 19, field.name, {
                        size: 11, fill: '#334155'
                    }));

                    // Field type (right-aligned)
                    g.appendChild(svgText(eb.x + eb.width - 8, rowY + 19, field.sql_type, {
                        size: 10, fill: '#64748b', mono: true, anchor: 'end'
                    }));
                });

                svgClone.appendChild(g);
            });

            const serializer = new XMLSerializer();
            const svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(svgClone);
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'dateaubase_erd.svg';
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        
        // --- Sidebar Logic ---
        function showFieldDetails(fieldJson, tableName, event) {
            event.stopPropagation(); // Prevent paper blank click from closing sidebar
            const field = JSON.parse(decodeURIComponent(fieldJson));
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-details');
            
            const desc = field.description || "No description available.";
            
            content.innerHTML = `
                <div class="field-detail">
                    <div class="detail-label">Table</div>
                    <div class="detail-value" style="font-weight: 600">${tableName}</div>
                </div>
                <div class="field-detail">
                    <div class="detail-label">Field</div>
                    <div class="detail-value">${field.name}</div>
                </div>
                <div class="field-detail">
                    <div class="detail-label">Type</div>
                    <div class="type-tag">${field.sql_type}</div>
                </div>
                <div class="field-detail">
                    <div class="detail-label">Description</div>
                    <div class="detail-value">${desc}</div>
                </div>
            `;
            
            if (field.is_fk && field.fk_target) {
                content.innerHTML += `
                     <div class="field-detail">
                        <div class="detail-label">Foreign Key Target</div>
                        <div class="detail-value">🔗 ${field.fk_target}</div>
                    </div>
                `;
            }
            
            sidebar.classList.add('open');
            
            // Highlight row visually (already handled by onclick row class? No, need logic)
            // Remove previous highlights
            document.querySelectorAll('.table-row').forEach(r => r.style.background = '');
            // Highlight current
            event.currentTarget.style.background = '#e0e7ff';
        }
        
        function showTableDetails(tableJson, event) {
            event.stopPropagation();
            const entity = JSON.parse(decodeURIComponent(tableJson));
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-details');

            const typeLabel = entity.type === 'view' ? 'View' : 'Table';
            const typeClass = entity.type === 'view' ? '#3b82f6' : '#64748b';

            let html = `
                <div class="field-detail">
                    <div class="detail-label">Type</div>
                    <div class="type-tag" style="background: ${typeClass}; color: white;">${typeLabel}</div>
                </div>
                <div class="field-detail">
                    <div class="detail-label">Name</div>
                    <div class="detail-value" style="font-weight: 600">${entity.name}</div>
                </div>
                <div class="field-detail">
                    <div class="detail-label">Description</div>
                    <div class="detail-value">${entity.description || "No description available."}</div>
                </div>
            `;

            // Show view definition if this is a view
            if (entity.type === 'view' && entity.definition) {
                html += `
                    <div class="field-detail">
                        <div class="detail-label">View Definition</div>
                        <div class="detail-value" style="font-family: monospace; font-size: 11px; background: #f8fafc; padding: 8px; border-radius: 4px;">${entity.definition}</div>
                    </div>
                `;
            }

            content.innerHTML = html;

            sidebar.classList.add('open');
            // Remove row highlights
            document.querySelectorAll('.table-row').forEach(r => r.style.background = '');
        }

        function closeSidebar() {
             document.getElementById('sidebar').classList.remove('open');
             document.querySelectorAll('.table-row').forEach(r => r.style.background = '');
        }
        
        // Close sidebar when clicking on paper blank area
        paper.on('blank:pointerdown', () => {
            closeSidebar();
        });

    </script>
</body>
</html>
