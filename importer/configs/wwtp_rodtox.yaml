api_config:
  api_url: http://localhost:8000

# RODTOX respirometer imported in equipment (tagless) mode from monEAU.
# Files are semicolon-separated CSVs with a VarName column (multi-variable long format).
# Comma decimal separator is handled automatically by the RodtoxFile reader.
# Equipment TEST_Rodtox-001 is auto-created by the importer on first run.
#
# Each parameter lives in a separate subdirectory; source_variable_name filters
# rows by the VarName column value within each file.
file_configs:
- name: rodtox_temp
  mode: tagless
  das_name: TEST_monEAU
  file_reader_type: rodtox
  file_structure:
    extension: .csv
    separator: ";"
    encoding: utf-8
    dt_format: '%d.%m.%Y %H:%M:%S'
    time_column: TimeString
    value_column: VarValue
    variable_column: VarName
    timezone: America/Montreal
    header_row_idx: 0
    first_valid_row_idx: 1
    last_valid_row_idx: -2
  variables:
  - name: rodtox_temperature
    parameter_name: Temperature
    source_unit_name: "°C"
    destination_unit_name: "°C"
    directory_path: test_data/rodtox/Temp
    equipment_name: TEST_Rodtox-001
    source_variable_name: HMI_Temp

- name: rodtox_do
  mode: tagless
  das_name: TEST_monEAU
  file_reader_type: rodtox
  file_structure:
    extension: .csv
    separator: ";"
    encoding: utf-8
    dt_format: '%d.%m.%Y %H:%M:%S'
    time_column: TimeString
    value_column: VarValue
    variable_column: VarName
    timezone: America/Montreal
    header_row_idx: 0
    first_valid_row_idx: 1
    last_valid_row_idx: -2
  variables:
  - name: rodtox_do
    parameter_name: Dissolved oxygen concentration
    source_unit_name: mg/L
    destination_unit_name: mg/L
    directory_path: test_data/rodtox/DO
    equipment_name: TEST_Rodtox-001
    source_variable_name: HMI_DO
