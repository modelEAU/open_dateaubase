api_config:
  api_url: http://localhost:8000

# PLC data imported in tagged mode from the PilEAUte SCADA database.
# DAS = the SCADA system; signal interface = the PLC front-end.
# Tag names confirmed from float_table.db TagTable.
scada_sql_configs:
- name: wwtp_plc_scada
  mode: tagged
  das_name: TEST_pilEAUTE_SCADA
  signal_interface_name: TEST_pilEAUTE_PLC
  scada_structure:
    timezone: America/Montreal
    sqlite_path: test_data/scada_sql/float_table.db
  variables:
  - name: plc_ph
    tag: HMI_pH
    parameter_name: pH
    source_unit_name: pH units
    destination_unit_name: pH units

  - name: plc_conductivity
    tag: HMI_Cond
    parameter_name: Conductivity
    source_unit_name: mS/cm
    destination_unit_name: mS/cm

  - name: plc_temperature
    tag: HMI_Temp
    parameter_name: Temperature
    source_unit_name: "°C"
    destination_unit_name: "°C"

  - name: plc_flow
    tag: HMI_Flow
    parameter_name: Flow
    source_unit_name: "m³/h"
    destination_unit_name: "m³/h"

  - name: plc_level
    tag: HMI_Level
    parameter_name: Level
    source_unit_name: m
    destination_unit_name: m

  - name: plc_turbidity
    tag: HMI_Turb
    parameter_name: Turbidity
    source_unit_name: NTU
    destination_unit_name: NTU

  - name: plc_do
    tag: HMI_DO
    parameter_name: Dissolved oxygen concentration
    source_unit_name: mg/L
    destination_unit_name: mg/L
