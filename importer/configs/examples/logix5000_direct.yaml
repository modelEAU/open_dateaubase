# Example: Logix5000 PLC acting directly as both DAS and SignalInterface.
#
# When a PLC collects sensor readings directly (no intermediate controller),
# DAS and SI share the same name.  Controller-scope tag names are used as-is
# as the Channel TagName — they are already unique within the PLC program.
# This pattern is common for in-line process instruments (flow, temperature)
# wired to analog I/O cards on the same chassis as the Logix5000 CPU.
api_config:
  api_url: http://localhost:8000/api/v1

file_configs:
- name: logix5000_direct
  mode: tagged
  das_name: hedi_plc
  signal_interface_name: hedi_plc
  file_structure:
    extension: .csv
    separator: ","
    encoding: utf-8
    dt_format: '%Y-%m-%d %H:%M:%S'
    time_column: Timestamp
    value_column: Value
    timezone: America/Montreal
    first_valid_row_idx: 1
    last_valid_row_idx: -1
    header_row_idx: 0
  variables:
  - name: plc_temperature
    parameter_name: Temperature
    source_unit_name: °C
    destination_unit_name: °C
    directory_path: data/hedi/plc
    tag: HED_TEMP_LIT001

  - name: plc_do
    parameter_name: Dissolved oxygen
    source_unit_name: mg/L
    destination_unit_name: mg/L
    directory_path: data/hedi/plc
    tag: HED_DO_LIT001

  - name: plc_conductivity
    parameter_name: Conductivity
    source_unit_name: mS/cm
    destination_unit_name: mS/cm
    directory_path: data/hedi/plc
    tag: HED_COND_LIT001
