api_config:
  api_url: http://localhost:8000/api/v1

# s::can ana::pro / spectro::lyser V160 imported in equipment (tagless) mode from monEAU.
# DAS = monEAU server; equipment = TEST_spectro::lyzer_V160.
#
# Two file types are produced by the instrument:
#   .par  — scalar computed parameters (TSS, COD, NH4-N, Temperature, …)
#   .fp   — full UV-Vis absorbance fingerprint (200–750 nm, 2.5 nm step)
#
# .par files are handled via file_configs (tagless), one entry per parameter
# because value_column is set at the file_structure level.
#
# .fp files are handled via vector_file_configs. LIMITATION: vector_file_configs
# currently only support tagged mode (no TaglessVectorFileVariable exists).
# As an interim, the device identifier is used as a synthetic tag so DAS/channel
# resolution still works. EquipmentWiringHistory is not opened for this channel.

# ──────────────────────────────────────────────────────────────────────────────
# Scalar parameters from .par files (tagless, one entry per parameter)
# ──────────────────────────────────────────────────────────────────────────────
# .par file structure (tab-separated, European decimal separator handled by reader):
#   Row 0: device identifier + label (metadata, dropped because header_row_idx=1)
#   Row 1: column headers (Date/Time, Status, TSSeq [mg/l]…, …)
#   Row 2+: data rows
file_configs:
- name: scan_par_tss
  mode: tagless
  das_name: TEST_monEAU
  file_structure:
    extension: .par
    separator: "\t"
    encoding: utf-8
    header_row_idx: 1
    first_valid_row_idx: 2
    last_valid_row_idx: -1
    time_column: Date/Time
    value_column: "TSSeq [mg/l]6000.00-0.00_1"
    dt_format: '%Y.%m.%d  %H:%M:%S'
    timezone: America/Montreal
    status_map:
      column: Status
      map:
        OK: null
        Warning: 2
      default_quality_code: 2
  variables:
  - name: scan_tss
    parameter_name: TSS
    source_unit_name: mg/L
    destination_unit_name: mg/L
    directory_path: test_data/scan
    equipment_name: TEST_spectro::lyzer_V160

- name: scan_par_cod
  mode: tagless
  das_name: TEST_monEAU
  file_structure:
    extension: .par
    separator: "\t"
    encoding: utf-8
    header_row_idx: 1
    first_valid_row_idx: 2
    last_valid_row_idx: -1
    time_column: Date/Time
    value_column: "CODeq [mg/l]7500.00-0.00_1"
    dt_format: '%Y.%m.%d  %H:%M:%S'
    timezone: America/Montreal
    status_map:
      column: Status
      map:
        OK: null
        Warning: 2
      default_quality_code: 2
  variables:
  - name: scan_cod
    parameter_name: COD
    source_unit_name: mg/L
    destination_unit_name: mg/L
    directory_path: test_data/scan
    equipment_name: TEST_spectro::lyzer_V160

- name: scan_par_nh4n
  mode: tagless
  das_name: TEST_monEAU
  file_structure:
    extension: .par
    separator: "\t"
    encoding: utf-8
    header_row_idx: 1
    first_valid_row_idx: 2
    last_valid_row_idx: -1
    time_column: Date/Time
    value_column: "NH4-N [mg/L]35.86-0.10_1"
    dt_format: '%Y.%m.%d  %H:%M:%S'
    timezone: America/Montreal
    status_map:
      column: Status
      map:
        OK: null
        Warning: 2
      default_quality_code: 2
  variables:
  - name: scan_nh4n
    parameter_name: Ammonium-N
    source_unit_name: mg/L
    destination_unit_name: mg/L
    directory_path: test_data/scan
    equipment_name: TEST_spectro::lyzer_V160

- name: scan_par_temp
  mode: tagless
  das_name: TEST_monEAU
  file_structure:
    extension: .par
    separator: "\t"
    encoding: utf-8
    header_row_idx: 1
    first_valid_row_idx: 2
    last_valid_row_idx: -1
    time_column: Date/Time
    value_column: "Temp. [°C]100.00--10.00_1"
    dt_format: '%Y.%m.%d  %H:%M:%S'
    timezone: America/Montreal
    status_map:
      column: Status
      map:
        OK: null
        Warning: 2
      default_quality_code: 2
  variables:
  - name: scan_temp
    parameter_name: Temperature
    source_unit_name: "°C"
    destination_unit_name: "°C"
    directory_path: test_data/scan
    equipment_name: TEST_spectro::lyzer_V160

# ──────────────────────────────────────────────────────────────────────────────
# UV-Vis absorbance fingerprint from .fp files (tagged, interim approach)
# ──────────────────────────────────────────────────────────────────────────────
# .fp file structure (tab-separated):
#   Row 0: device identifier (dropped because header_row_idx=1 in pandas)
#   Row 1: column headers (Date/Time, Status_0, 200.00, 202.50, …, 750.00)
#   Row 2+: data rows
vector_file_configs:
- name: scan_fp_absorbance
  mode: tagged
  das_name: TEST_monEAU
  file_structure:
    extension: .fp
    separator: "\t"
    encoding: utf-8
    metadata_rows: 0
    header_row_idx: 1
    dt_column: Date/Time
    dt_format: '%Y.%m.%d  %H:%M:%S'
    timezone: America/Montreal
    status_map:
      column: Status_0
      map:
        OK: null
        Failure: 2
      default_quality_code: 2
  variables:
  - name: scan_absorbance
    parameter_name: absorbance
    source_unit_name: AU
    destination_unit_name: AU
    directory_path: test_data/scan
    tag: TEST_spectro::lyzer_V160
    axis:
      name: UV-vis 200-750nm
      description: UV-Vis absorbance spectrum 200–750 nm at 2.5 nm step (spectro::lyser)
