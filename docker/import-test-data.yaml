# Configuration for importing test data files into the database
# This is used by the docker-compose setup to seed test data
#
# Schema: tagged sources use DAS+tag for server-side channel resolution
#         tagless sources use DAS+equipment_name for server-side channel resolution

api_config:
  api_url: "http://api:8000"
  min_timestamp: "2024-01-01T00:00:00"

file_configs:
  # Tagless CSV import (Rodtox format)
  # Uses equipment_name for channel resolution (tagless mode)
  - name: rodtox
    mode: tagless
    das_name: rodtox_das
    file_structure:
      extension: ".csv"
      separator: ";"
      encoding: "UTF-8"
      dt_format: "%d.%m.%Y %H:%M:%S"
      time_column: "TimeString"
      timezone: "US/Eastern"
      value_column: "VarValue"
      variable_column: "VarName"
      validity_column: "Validity"
      validity_flag: 1
      first_valid_row_idx: 1
      last_valid_row_idx: -2
      header_row_idx: 0
    variables:
      - name: do
        directory_path: "/test-data/rodtox/DO"
        source_variable_name: "HMI_DO"
        equipment_name: "Rodtox-001"
        parameter_name: "Dissolved oxygen"
        source_unit_name: "mg/L"
        destination_unit_name: "mg/L"
        conversion_factor: 1.0
        data_provenance_id: 1
        processing_degree_id: 1
      - name: temp
        directory_path: "/test-data/rodtox/Temp"
        source_variable_name: "HMI_Temp"
        equipment_name: "Rodtox-001"
        parameter_name: "Temperature"
        source_unit_name: "°C"
        destination_unit_name: "°C"
        conversion_factor: 1.0
        data_provenance_id: 1
        processing_degree_id: 1

tsdb_configs:
  # Tagless TSDB import (basestation format)
  # Uses equipment_name for channel resolution (tagless mode)
  - name: basestation
    mode: tagless
    das_name: basestation_das
    tsdb_structure:
      extension: ".tsdb"
      timezone: "America/Montreal"
    variables:
      - name: turb
        directory_path: "/test-data/basestation"
        equipment_name: "Basestation-Turb"
        parameter_name: "Turbidity"
        source_unit_name: "NTU"
        destination_unit_name: "NTU"
        conversion_factor: 1.0
        data_provenance_id: 1
        processing_degree_id: 1

scada_sql_configs:
  # Tagged SCADA SQL import (pilEAUte format)
  # Uses tag for channel resolution (tagged mode)
  - name: pilEAUte
    das_name: pilEAUte_das
    scada_structure:
      server: "localhost"
      database: "test"
      credentials_path: "/run/secrets/scada_credentials"
      timezone: "America/Montreal"
    variables:
      - name: do
        tag: "HMI_DO"
        parameter_name: "Dissolved oxygen"
        source_unit_name: "mg/L"
        destination_unit_name: "mg/L"
        conversion_factor: 1.0
        data_provenance_id: 1
        processing_degree_id: 1
