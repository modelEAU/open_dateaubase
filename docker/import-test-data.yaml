image_folder_configs:
  # Tagless image import (felinoscope_2000 — no EXIF datetime, uses file mtime)
  - name: felinoscope_2000
    mode: tagless
    das_name: felinoscope_das
    folder_structure:
      extensions: [".jpg", ".jpeg", ".png", ".tiff"]
      timezone: "America/Montreal"
      timestamp_source: mtime
    variables:
      - name: felinoscope_2000_floc_morphology
        parameter_name: floc_morphology
        source_unit_name: "-"
        destination_unit_name: "-"
        directory_path: "/test-data/images/felinoscope_2000"
        equipment_name: felinoscope_2000
