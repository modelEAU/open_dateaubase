# Configuration for importing test data files into the database
# This is used by the docker-compose setup to seed test data
#
# Schema: tagged sources use DAS+tag for server-side channel resolution
#         tagless sources use DAS+equipment_name for server-side channel resolution

api_config:
  api_url: "http://api:8000"

file_configs:
  # Tagless CSV import (Rodtox format)
  # Uses equipment_name for channel resolution (tagless mode)
  - name: rodtox
    mode: tagless
    das_name: pilEAUte_monEAU
    file_structure:
      extension: ".csv"
      separator: ";"
      encoding: "UTF-8"
      dt_format: "%d.%m.%Y %H:%M:%S"
      time_column: "TimeString"
      timezone: "US/Eastern"
      value_column: "VarValue"
      variable_column: "VarName"
      status_map:
        column: "Validity"
        map:
          "1": null
      first_valid_row_idx: 1
      last_valid_row_idx: -2
      header_row_idx: 0
    variables:
      - name: do
        directory_path: "/test-data/rodtox/DO"
        source_variable_name: "HMI_DO"
        equipment_name: "Rodtox-001"
        parameter_name: "Dissolved oxygen"
        source_unit_name: "mg/L"
        destination_unit_name: "mg/L"
        conversion_factor: 1.0
        data_provenance_id: 1
        processing_degree_id: 1
      - name: temp
        directory_path: "/test-data/rodtox/Temp"
        source_variable_name: "HMI_Temp"
        equipment_name: "Rodtox-001"
        parameter_name: "Temperature"
        source_unit_name: "°C"
        destination_unit_name: "°C"
        conversion_factor: 1.0
        data_provenance_id: 1
        processing_degree_id: 1

tsdb_configs:
  # Tagless TSDB import (basestation format)
  # Uses equipment_name for channel resolution (tagless mode)
  - name: basestation
    mode: tagless
    das_name: pilEAUte_monEAU
    tsdb_structure:
      extension: ".tsdb"
      timezone: "America/Montreal"
    variables:
      - name: turb
        directory_path: "/test-data/basestation"
        equipment_name: "Basestation-Turb"
        parameter_name: "Turbidity"
        source_unit_name: "NTU"
        destination_unit_name: "NTU"
        conversion_factor: 1.0
        data_provenance_id: 1
        processing_degree_id: 1

scada_sql_configs:
  # Tagged SCADA SQL import using local SQLite test fixture (pilEAUte schema)
  - name: pilEAUte
    das_name: pilEAUte_SCADA
    scada_structure:
      sqlite_path: "/test-data/scada_sql/float_table.db"
      timezone: "America/Montreal"
    variables:
      - name: do
        tag: "HMI_DO"
        parameter_name: "Dissolved oxygen"
        source_unit_name: "mg/L"
        destination_unit_name: "mg/L"
        conversion_factor: 1.0
        data_provenance_id: 1
        processing_degree_id: 1

vector_file_configs:
  # Tagged spectrophotometer import (spectro::lyser .fp files from basestation)
  - name: spectrolyser_basestation
    mode: tagged
    das_name: pilEAUte_monEAU
    file_structure:
      extension: ".fp"
      separator: "\t"
      encoding: "utf-8"
      metadata_rows: 0
      header_row_idx: 1
      dt_column: "Date/Time"
      dt_format: "%Y.%m.%d  %H:%M:%S"
      timezone: "America/Montreal"
      status_map:
        column: "Status_0"
        map:
          OK: null
          Failure: 2
        default_quality_code: 2
    variables:
      - name: spectrolyser_basestation_absorbance
        parameter_name: absorbance
        source_unit_name: AU
        destination_unit_name: AU
        directory_path: "/test-data/basestation"
        tag: "13230077_10_0x0100_spectro::lyser_INFLUENTV160"
        axis:
          name: "UV-vis 200-750nm"
          description: "UV-Vis absorbance spectrum 200-750 nm at 2.5 nm step (spectro::lyser)"
          unit_name: nm
