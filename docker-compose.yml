services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: open_dateaubase_db
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "14330:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools
    platform: linux/amd64
    container_name: open_dateaubase_db_init
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
    volumes:
      - ./sql_generation_scripts:/sql:ro
    command:
      - /bin/bash
      - -lc
      - |
          set -e

          SQLCMD=/opt/mssql-tools/bin/sqlcmd

          echo "Checking sqlcmd path..."
          ls -l "$$SQLCMD"

          echo "Waiting for SQL Server..."
          for i in $$(seq 1 30); do
            if "$$SQLCMD" -b -C -S db -U sa -P "$$SA_PASSWORD" -Q "SELECT 1"; then
              echo "SQL Server is ready ✅"
              break
            fi
            echo "Still waiting..."
            sleep 2
          done

          echo "Creating database if needed..."
          "$$SQLCMD" -b -C -S db -U sa -P "$$SA_PASSWORD" -d master -Q "IF DB_ID('proposed_2025_11') IS NULL CREATE DATABASE proposed_2025_11"

          echo "Running schema..."
          "$$SQLCMD" -b -C -S db -U sa -P "$$SA_PASSWORD" -d proposed_2025_11 -i /sql/2025-11-27_proposed_.sql

          echo "Running seed..."
          "$$SQLCMD" -b -C -S db -U sa -P "$$SA_PASSWORD" -d proposed_2025_11 -i /sql/2025-11-27_seed_test_data.sql

          echo "db-init done ✅"
    restart: "no"

  api:
    build: .
    container_name: open_dateaubase_api
    env_file:
      - .env
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: uvicorn api_metadata.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    restart: unless-stopped

  streamlit:
    build: .
    container_name: open_dateaubase_streamlit
    env_file:
      - .env
    environment:
      API_BASE_URL: "http://api:8000"
    depends_on:
      - api
    command: python -m streamlit run api_metadata/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  mssql_data: