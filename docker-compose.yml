# Cap per-container log files so nothing can grow unbounded on disk
# (json-file's default is no limit). Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: open_dateaubase_db
    logging: *default-logging
    env_file:
      - .env.docker
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools
    platform: linux/amd64
    container_name: open_dateaubase_db_init
    logging: *default-logging
    restart: "no"
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - ./sql:/sql
      - ./migrations:/migrations
      - ./sql_generation_scripts:/sql_generation_scripts
    entrypoint: |
      /bin/bash -lc '
      set -euo pipefail

      SQLCMD=/opt/mssql-tools18/bin/sqlcmd
      [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd

      echo "Waiting for SQL Server..."
      for i in $$(seq 1 60); do
        "$$SQLCMD" -S db,1433 -U SA -P "$$DB_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && break
        sleep 2
      done

      # Check if DB is already initialised; skip if so
      INITIALIZED=$$("$$SQLCMD" -S db,1433 -U SA -P "$$DB_PASSWORD" -h-1 \
        -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = '"'"'open_dateaubase'"'"'" \
        2>/dev/null | tr -d " \r\n")
      if [ "$$INITIALIZED" = "1" ]; then
        echo "Database already initialized, skipping."
        exit 0
      fi

      echo "Running init.sql..."
      "$$SQLCMD" -S db,1433 -U SA -P "$$DB_PASSWORD" -b -V 16 -r 1 -I -i /sql/init.sql
      echo "Done."
      '

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: open_dateaubase_api
    logging: *default-logging
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  importer:
    build:
      context: .
      dockerfile: Dockerfile.importer
    container_name: open_dateaubase_import
    logging: *default-logging
    restart: "no"
    env_file:
      - .env.docker
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./importer/test_data:/app/test_data
      - ./importer/configs:/configs
    command: ["import", "--config-dir", "/configs", "--api-url", "http://api:8000"]

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: open_dateaubase_app
    logging: *default-logging
    ports:
      - "8501:8501"
    env_file:
      - .env.docker          # provides API_SERVICE_TOKEN for dev auto-login
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      - APP_DEV_AUTO_LOGIN=1
      - APP_DEV_NAME="dev account"  # optional
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql_data:
