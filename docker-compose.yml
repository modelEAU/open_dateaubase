services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: open_dateaubase_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPwd123!"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./sql:/sql
      - ./docker/mssql-init.sh:/mssql-init.sh
    command: /bin/bash /mssql-init.sh
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: open_dateaubase_api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: open_dateaubase_app
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql_data:
