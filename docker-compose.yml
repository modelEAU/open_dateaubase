services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: open_dateaubase_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPwd123!"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools
    platform: linux/amd64
    container_name: open_dateaubase_db_init
    restart: "no"
    profiles: ["init"]
    depends_on:
      - db
    volumes:
      - ./sql:/sql
      - ./sql_generation_scripts:/sql_generation_scripts
      - ./migrations:/migrations
    entrypoint: |
      /bin/bash -lc '
      set -euo pipefail

      SQLCMD=/opt/mssql-tools18/bin/sqlcmd
      [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd

      echo "Waiting for SQL Server..."
      for i in {1..60}; do
        "$$SQLCMD" -S db,1433 -U SA -P "StrongPwd123!" -Q "SELECT 1" && break
        sleep 2
      done

      # Hard fail if still not reachable
      "$$SQLCMD" -S db,1433 -U SA -P "StrongPwd123!" -Q "SELECT 1" >/dev/null

      echo "Running init.sql..."
      "$$SQLCMD" -S db,1433 -U SA -P "StrongPwd123!" -b -V 16 -r 1 -i /sql/init.sql

      echo "Done."
      '


  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: open_dateaubase_api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: open_dateaubase_app
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql_data:
