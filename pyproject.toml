[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-dateaubase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.6.22",
    "pydantic>=2.0.0",
    "mkdocs-gen-files>=0.5.0",
    "markdown-exec>=1.12.1",
    "pymdown-extensions>=10.16.1",
    "python-multipart>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.27.0",
]
test = [
    "pytest-playwright>=0.5",
]
db = [
    "pyodbc>=5.1",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyodbc>=5.1",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pyjwt>=2.0",
]
app = [
    "streamlit>=1.40",
    "httpx>=0.28",
    "plotly>=5.24",
    "folium>=0.17",
    "streamlit-folium>=0.22",
    "streamlit-searchbox>=0.1.24",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Workspace members with their own pyproject + dev deps are excluded from
# the root pytest run. Run their suites from inside the member dir:
#   uv run --package table-import pytest
norecursedirs = ["importer", ".git", ".venv", ".claude", "build", "dist", "site"]
markers = [
    "db: requires running MSSQL Docker container",
    "browser: requires running app+API+seeded DB (tests/e2e, opt-in via -m browser)",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_dateaubase = ["*.json", "dictionary.json"]

[tool.uv.workspace]
members = ["importer"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260408",
]
